# Existing versionless cabinet format from config-spec section 5.
id = "model3-dirtdvls"
title = "Dirt Devils cabinet"
seat = { height_m = 0.55, posture = "seated" }

[[element]]
id = "wheel"
label = "Steering"
type = "wheel"
source = "both_hands"
node = "pivot_wheel"
output = { axis = "Steering", range = [0, 255], centre = 128, invert = false }
model = "wheel-three-spoke"
position = [0, 0.78, -0.42]
tilt_deg = 25
radius_m = 0.176
range_deg = 270
extractor = "bar_roll"
axes = { component = "wheel_normal", positive = "clockwise/right" }
calibration = { centre = "before_launch", range = [-135, 135] }
grab = { required = true, button = "grip", radius_m = 0.06, soft_lock = true, preserve_current_angle = true, one_hand_fallback = "angle_about_hub", anchors = ["grab_left", "grab_right"] }
curve = { deadzone = 0.025, gamma = 1 }
spring = { return_speed = 6 }
tracking_loss = "freeze_then_neutral"
haptics = { centre_detent = 0.2 }
model_instance = "wheel-three-spoke-p1"
label_node = "label_steering"

[[element]]
id = "accelerator"
label = "Accelerator"
type = "pedal"
source = "right_trigger"
node = "pivot_accelerator"
output = { axis = "Accelerator", range = [0, 255], invert = false }
model = "pedals-dual"
position = [0, 0.1, -0.48]
extractor = "trigger"
curve = { deadzone = 0.04, gamma = 1.4 }
axes = { positive = "squeeze" }
grab = { required = false }
model_instance = "pedals-dual-p1"
label_node = "label_accelerator"

[[element]]
id = "brake"
label = "Brake"
type = "pedal"
source = "left_trigger"
node = "pivot_brake"
output = { axis = "Brake", range = [0, 255], invert = false }
model = "pedals-dual"
position = [0, 0.1, -0.48]
extractor = "trigger"
curve = { deadzone = 0.04, gamma = 1.4 }
axes = { positive = "squeeze" }
grab = { required = false }
model_instance = "pedals-dual-p1"
label_node = "label_brake"

[[element]]
id = "shifter"
label = "Shift up/down"
type = "shifter_seq"
source = "right_hand"
node = "pivot_shift"
output = { up = "GearShiftUp", down = "GearShiftDown" }
model = "shifter-sequential"
position = [0.26, 0.55, -0.25]
extractor = "lever_slide"
axes = { plane = "xz", forward = "negative_z" }
range_m = { z = [-0.055, 0.055] }
grab = { required = true, button = "right_grip", radius_m = 0.055, soft_lock = true, anchors = ["grab_knob"] }
gate = { spring_return = true, pulse_on_entry = true }
binding = { mode = "hold" }
haptics = { gear_detent = 0.25 }
model_instance = "shifter-sequential-p1"
label_node = "label_shifter"

[[element]]
id = "start"
label = "Start"
type = "button"
source = "left_thumbstick_click"
node = ""
output = { button = "Start1" }
binding = { mode = "press" }

[[element]]
id = "coin"
label = "Insert credit"
type = "button"
source = "right_thumbstick_click"
node = ""
output = { button = "Coin1" }
binding = { mode = "press" }

[[element]]
id = "view"
label = "Change view"
type = "button"
source = "right_primary"
node = "button_view"
output = { button = "ViewChange" }
model = "panel-view-one"
binding = { mode = "press", modifier = "right_grip_released" }
model_instance = "panel-view-one-p1"
position = [0, 0.85, -0.4]
label_node = "label_view"

[hold]
default = "cab-sequential-one-grab-wheel-lever"

[holds.cab-sequential-one-grab-wheel-lever]
title = "Sequential One / grab wheel / lever"
description = "Steer comfortably, with trigger pedals and a grabbed gear lever."
control_set = "cab-sequential-one-grab-wheel-lever"
default = true
picture_light = "assets/controls/cards/cab-sequential-one-grab-wheel-lever-light.svg"
picture_dark = "assets/controls/cards/cab-sequential-one-grab-wheel-lever-dark.svg"

[holds.cab-sequential-one-grab-wheel-buttons]
title = "Sequential One / grab wheel / buttons"
description = "Steer comfortably, with trigger pedals and thumbstick gear buttons."
control_set = "cab-sequential-one-grab-wheel-buttons"
default = false
picture_light = "assets/controls/cards/cab-sequential-one-grab-wheel-buttons-light.svg"
picture_dark = "assets/controls/cards/cab-sequential-one-grab-wheel-buttons-dark.svg"

[holds.cab-sequential-one-tilt-wheel-lever]
title = "Sequential One / tilt wheel / lever"
description = "Steer comfortably, with trigger pedals and a grabbed gear lever."
control_set = "cab-sequential-one-tilt-wheel-lever"
default = false
picture_light = "assets/controls/cards/cab-sequential-one-tilt-wheel-lever-light.svg"
picture_dark = "assets/controls/cards/cab-sequential-one-tilt-wheel-lever-dark.svg"

[holds.cab-sequential-one-tilt-wheel-buttons]
title = "Sequential One / tilt wheel / buttons"
description = "Steer comfortably, with trigger pedals and thumbstick gear buttons."
control_set = "cab-sequential-one-tilt-wheel-buttons"
default = false
picture_light = "assets/controls/cards/cab-sequential-one-tilt-wheel-buttons-light.svg"
picture_dark = "assets/controls/cards/cab-sequential-one-tilt-wheel-buttons-dark.svg"

[holds.cab-sequential-one-thumbstick-lever]
title = "Sequential One / thumbstick / lever"
description = "Steer comfortably, with trigger pedals and a grabbed gear lever."
control_set = "cab-sequential-one-thumbstick-lever"
default = false
picture_light = "assets/controls/cards/cab-sequential-one-thumbstick-lever-light.svg"
picture_dark = "assets/controls/cards/cab-sequential-one-thumbstick-lever-dark.svg"

[holds.cab-sequential-one-thumbstick-buttons]
title = "Sequential One / thumbstick / buttons"
description = "Steer comfortably, with trigger pedals and thumbstick gear buttons."
control_set = "cab-sequential-one-thumbstick-buttons"
default = false
picture_light = "assets/controls/cards/cab-sequential-one-thumbstick-buttons-light.svg"
picture_dark = "assets/controls/cards/cab-sequential-one-thumbstick-buttons-dark.svg"
