# starter values copied from Umbrella Chronicles, untested in the headset
# Dead Space: Extraction, USA disc (RZJE69).
# Source profile: RBUP08.ini (Umbrella Chronicles, Europe), its [Graphics.VR] values only.
# Adjustment: none. First-person on-rails horror shooter, the closest match to Umbrella
#   apart from Darkside and Overkill.
# Known fault: with the Dolphin default VR screen the start panel appeared very small and
#   dark. A world-scaled screen at 4 units may help or may not; it has not been tried.
# Not copied: the Umbrella [ShaderOverride] HUD entries (Umbrella shader hashes only).
# Fallback to try first if this looks wrong: VirtualScreen = True, ScreenDistance = 1.5,
#   ScreenSize = 1.5 (see data/profiles/dolphinxr/drafts/RZJE69.ini in the AladdinsCastle repo).
# 2026-10-21 (AladdinsCastle stereo fix): VirtualScreen True. With False every 2D draw (title,
#   menus, HUD, crosshair) was rendered identically into both eyes and glued to the face, at
#   zero depth, while the 3D world moved with the head. Offline per-eye proof: eyes identical (0 px)
#   with False; with True the 2D sits on a screen 4 m away in the room (15 px disparity).
#   Gameplay not checked offline. If gameplay shows the world inside a flat window, set False again.
[Graphics.VR]
VirtualScreen = True
UnitsPerMeter = 10
ScreenDistance = 4
ScreenSize = 4
