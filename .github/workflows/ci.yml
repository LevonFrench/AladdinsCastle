name: Hub CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software
  QT_OPENGL: software

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/validate_catalog.py
      - run: python tools/validate_catalog.py --test
      - name: Emulator pin tool tests (local JSON fixture; no network, no downloads)
        timeout-minutes: 2
        run: python tools/pin_artifact.py --test
      - name: Emulator manifest lint (https, allow-listed hosts, pins, sizes, licence notes, no game or BIOS content)
        timeout-minutes: 2
        run: |
          python tools/validate_emulator_manifests.py --test
          python tools/validate_emulator_manifests.py
      - name: Wii DSU packet, hand isolation and motion checks
        run: python -m unittest discover -s tools/wii-bridge -p "test_*.py" -v
      - name: Isolated Dolphin profile checks
        run: python -m unittest discover -s tools/wii-dolphin-profile -p 'test_*.py' -v
      - name: Shared Wii shell and stick profiles
        run: python -m unittest discover -s tools -p test_wii_shell_stick.py -v
      - name: Exported shell and stick model contracts
        run: python -m unittest discover -s tools -p test_shell_models.py -v
      - name: Synthetic Wii frame-rate preparation checks
        run: python -m unittest discover -s data/performance -p test_phase1.py -v
      - name: Heavy-run lease tests (temporary folders only)
        working-directory: tools
        timeout-minutes: 2
        run: python -B -m unittest -v test_heavy_lease
      - name: Pre-push check tests
        timeout-minutes: 2
        run: python tools/pre_push.py --test
      - name: Wii motion binding checks (fail on a missing section or an empty profile folder)
        timeout-minutes: 2
        run: python setups/dolphin-vr/motion-controls/check_bindings.py
      - name: Universal controls, Wii and GameCube expressions (synthetic CPU only)
        working-directory: setups/dolphin-vr/motion-controls
        timeout-minutes: 2
        run: python -B -m unittest -v test_universal_controls
      - name: Universal controls, Python checks (control data, cards, pinball, System 22, cabinets)
        timeout-minutes: 5
        run: |
          python -B -m unittest -v test_pinball_controls test_system22_controls test_wii_profile_audit test_wii_controls test_cabinet_motion
          python -I ../hub/tests/universal_controls_text.py
        working-directory: tools
      - name: Universal controls, host profile and binding checks (retro host, PCSX2 patch, Flycast copies)
        timeout-minutes: 5
        run: |
          python setups/retro-ps1-vr/test_host_profiles.py
          python setups/pcsx2-vr/stick_chord_test.py
          python setups/flycast-hotd2-vr/tools/test_chord_copies.py
      - name: Universal controls, stick-click resolvers (standalone C++17, CPU only)
        timeout-minutes: 5
        run: |
          if ! command -v g++ >/dev/null 2>&1; then
            echo "::error::Existing g++ required for the stick-click resolver checks."
            exit 1
          fi
          mkdir -p .local/chord-ci
          g++ -std=c++17 -Wall -Wextra -Werror -I setups/retro-ps1-vr/host setups/retro-ps1-vr/host/StickChordTest.cpp -o .local/chord-ci/retro-chord
          .local/chord-ci/retro-chord
          g++ -std=c++17 -Wall -Wextra -Werror -I setups/mame-model2-vr/presenter/legacy setups/mame-model2-vr/chord_resolver_test.cpp -o .local/chord-ci/model2-chord
          .local/chord-ci/model2-chord
          g++ -std=c++17 -Wall -Wextra -Werror -I setups/supermodel-vr/patch setups/supermodel-vr/tools/chord_resolver_test.cpp -o .local/chord-ci/model3-chord
          .local/chord-ci/model3-chord
      - name: Offline Wii scorecard tooling (synthetic CPU only)
        working-directory: setups/dolphin-vr/scorecard
        timeout-minutes: 2
        run: python -B -m unittest -v test_scorecard test_runner test_metrics test_ingest
      - name: Offline input append parser (standalone C++17)
        timeout-minutes: 2
        run: |
          if command -v g++ >/dev/null 2>&1; then
            mkdir -p .local/append-parser-ci/fixtures
            g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
              setups/dolphin-vr/motion-controls/input-probe/test_input_append.cpp \
              -o .local/append-parser-ci/test-input-append
            .local/append-parser-ci/test-input-append "$GITHUB_WORKSPACE/.local/append-parser-ci/fixtures"
          else
            echo "::error::Existing g++ required for the standalone append-parser check."
            exit 1
          fi
      - name: Offline draw-discovery evidence checks (synthetic CPU only)
        working-directory: setups/dolphin-vr/draw-discovery
        timeout-minutes: 2
        run: python -B -m unittest -v test_discovery
      - name: Parse all catalog and theme TOML
        shell: python
        run: |
          import pathlib, tomllib
          paths = [*pathlib.Path("data").rglob("*.toml"),
                   *pathlib.Path("games").rglob("*.toml"),
                   pathlib.Path("docs/ui/theme.toml")]
          for path in sorted(paths):
              with path.open("rb") as stream:
                  tomllib.load(stream)
          print(f"Parsed {len(paths)} TOML files")

  hub:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline Wii scorecard tooling (Windows synthetic CPU only)
        if: runner.os == 'Windows'
        working-directory: setups/dolphin-vr/scorecard
        timeout-minutes: 2
        run: python -B -m unittest -v test_scorecard test_runner test_metrics test_ingest
      - name: Offline draw-discovery evidence checks (Windows synthetic CPU only)
        if: runner.os == 'Windows'
        working-directory: setups/dolphin-vr/draw-discovery
        timeout-minutes: 2
        run: python -B -m unittest -v test_discovery
      - name: Sitting configuration in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/dolphinxr-sitting/Test-Sitting.ps1
      - name: Read package identity
        shell: python
        run: |
          import json, os, pathlib, re
          identity = json.loads(pathlib.Path('data/product.json').read_text(encoding='utf-8'))
          folder = identity['user_data_folder']
          if identity['schema'] != 1 or not re.fullmatch(r'[A-Za-z0-9_-]+', folder):
              raise SystemExit('Invalid product package directory')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'AC_PRODUCT_DIR={folder}\nAC_PRODUCT_ARTIFACT={folder}-Windows-x64\n')
      - name: Synthetic frame-rate lease and quiet-machine refusal checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./data/performance/test_collector_gates.ps1
      - name: Set up MSVC 2022 x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0
      - name: Install pinned Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.8.3'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || 'linux_gcc_64' }}
          modules: 'qtshadertools'
          cache: true
      - name: Pin CMake and Ninja
        run: python -m pip install cmake==3.31.10 ninja==1.13.0
      - name: Dolphin facing math (CPU only)
        run: |
          cmake -S setups/dolphin-vr/facing -B build-dolphin-facing -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TRY_COMPILE_CONFIGURATION=Release
          cmake --build build-dolphin-facing --target ac-dolphin-facing-test
          ctest --test-dir build-dolphin-facing --output-on-failure
      - name: Dolphin route diagnostics (synthetic CPU only)
        run: |
          cmake -S setups/dolphin-vr/route-diagnostic -B build-dolphin-route -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TRY_COMPILE_CONFIGURATION=Release
          cmake --build build-dolphin-route --target ac-dolphin-route-trace-test
          ctest --test-dir build-dolphin-route --output-on-failure
      - run: cmake -S hub -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile native Wii pose reader (no VR initialization)
        run: |
          cmake -S tools/wii-bridge -B build-wii-bridge -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENVR_SOURCE=${{ github.workspace }}/build/_deps/openvr-src
          cmake --build build-wii-bridge --parallel 2
      - name: Dolphin theatre build and headless checks
        run: |
          cmake -S tools/wii-dolphin-profile/theatre -B build-wii-theatre -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENVR_SOURCE=${{ github.workspace }}/build/_deps/openvr-src
          cmake --build build-wii-theatre --parallel 2
          ctest --test-dir build-wii-theatre --output-on-failure
      - name: Build libacvr runtime and ABI checks (no XR or graphics)
        run: |
          cmake -S libacvr -B build-contract -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DACVR_JSON_INCLUDE_DIR=${{ github.workspace }}/build/_deps/nlohmann_json-src/include -DACVR_TOML_INCLUDE_DIR=${{ github.workspace }}/build/_deps/tomlplusplus-src/include -DACVR_BUILD_GL_GUN_RENDERER=ON
          cmake --build build-contract --parallel 2
          ctest --test-dir build-contract --output-on-failure
      - name: Fetch pinned OpenXR headers (headers only, SHA-256 checked)
        if: runner.os == 'Windows'
        shell: python
        timeout-minutes: 5
        run: |
          # Version and per-file hashes come from the repo's own pin; the tag is derived from it.
          import hashlib, json, pathlib, time, urllib.request
          pin = json.loads(pathlib.Path('setups/mame-model2-vr/upstream-pin.json').read_text(encoding='utf-8'))['openxr_headers']
          tag = 'release-' + pin['version']
          target = pathlib.Path('build-openxr/include/openxr')
          target.mkdir(parents=True, exist_ok=True)
          for name, expected in sorted(pin['sha256'].items()):
              url = f'https://raw.githubusercontent.com/KhronosGroup/OpenXR-SDK/{tag}/include/openxr/{name}'
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url, timeout=60) as response:
                          data = response.read()
                      break
                  except OSError:
                      if attempt == 2:
                          raise
                      time.sleep(5)
              # The pin hashed openxr_platform_defines.h with CRLF line endings; upstream ships LF. Accept either form of the same text.
              digest = hashlib.sha256(data).hexdigest()
              if expected not in (digest, hashlib.sha256(data.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')).hexdigest()):
                  raise SystemExit(f'{name} from {tag} has SHA-256 {digest}, expected {expected}')
              (target / name).write_bytes(data)
          print(f'Fetched {len(pin["sha256"])} OpenXR {pin["version"]} headers into {target}')
      - name: Compile acvr-ps1 libretro VR host (MinGW g++, no VR initialization)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          # build-host.ps1 takes the toolchain root; use the image's existing MinGW, never install one.
          $root = @("$env:SystemDrive\msys64", "$env:SystemDrive\") | Where-Object { Test-Path (Join-Path $_ 'mingw64\bin\g++.exe') } | Select-Object -First 1
          if (-not $root) { throw 'Existing MinGW g++ required on the runner for the acvr-ps1 host build.' }
          & (Join-Path $root 'mingw64\bin\g++.exe') --version
          $out = Join-Path $env:RUNNER_TEMP 'acvr-ps1'
          try {
            ./setups/retro-ps1-vr/build-host.ps1 -OpenXRInclude "$env:GITHUB_WORKSPACE/build-openxr/include" -OutputDirectory $out -MsysRoot $root
          } finally {
            foreach ($log in 'host-build.log', 'host-build-errors.log') {
              $path = Join-Path $out $log
              if (Test-Path $path) { Write-Host "--- $log"; Get-Content -LiteralPath $path }
            }
          }
          if (-not (Test-Path (Join-Path $out 'acvr-ps1.exe'))) { throw 'acvr-ps1.exe was not produced' }
      - name: Presenter tests, compile and link only (MinGW g++, no window, no XR; the injected shared policy test runs)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          # theatre_test and both presenter_test.cpp files open hidden GL windows and need a real GL context, so they are built but never run here.
          # shared_test.cpp only uses injected callbacks (no window, loader or runtime), so it is built and run. The compile flags follow setups/mame-model2-vr/test-presenter.ps1.
          $root = @("$env:SystemDrive\msys64", "$env:SystemDrive\") | Where-Object { Test-Path (Join-Path $_ 'mingw64\bin\g++.exe') } | Select-Object -First 1
          if (-not $root) { throw 'Existing MinGW g++ required on the runner for the presenter test builds.' }
          $env:PATH = (Join-Path $root 'mingw64\bin') + ';' + $env:PATH
          $xr = "$env:GITHUB_WORKSPACE/build-openxr/include"
          $out = Join-Path $env:RUNNER_TEMP 'presenter-tests'
          New-Item -ItemType Directory -Force $out | Out-Null
          $libs = '-lopengl32', '-lgdi32', '-luser32'
          $shared = 'libacvr/publish-presenter'
          g++ -std=c++17 -O1 -I $shared -I $xr "$shared/shared_test.cpp" @libs -o "$out/shared_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'shared_test build failed' }
          g++ -std=c++17 -O1 -I $shared -I $xr "$shared/theatre_test.cpp" @libs -o "$out/theatre_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'theatre_test build failed' }
          foreach ($flavour in 'setups/mame-model2-vr/presenter', 'setups/mame-model2-vr/presenter/legacy') {
            $name = 'presenter_test_' + ($flavour -replace '[^A-Za-z0-9]+', '_')
            g++ -std=c++17 -O1 -I $flavour -I $xr "$flavour/presenter_test.cpp" @libs -o "$out/$name.exe"
            if ($LASTEXITCODE -ne 0) { throw "$flavour presenter_test build failed" }
          }
          & "$out/shared_test.exe"
          if ($LASTEXITCODE -ne 0) { throw "shared_test exit $LASTEXITCODE" }
      - name: Gun room build and CPU-only checks (no XR, graphics or window)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        run: |
          cmake -S tools/gun-room -B build-gun-room -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DACVR_JSON_INCLUDE_DIR=${{ github.workspace }}/build/_deps/nlohmann_json-src/include -DACVR_TOML_INCLUDE_DIR=${{ github.workspace }}/build/_deps/tomlplusplus-src/include -DACVR_OPENXR_INCLUDE_DIR=${{ github.workspace }}/build-openxr/include
          cmake --build build-gun-room --parallel 2
          ctest --test-dir build-gun-room --output-on-failure --timeout 60
      - name: System 22 synthetic stereo checks
        run: |
          cmake -S setups/namco22-vr -B build-stereo -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-stereo --parallel 2
          ctest --test-dir build-stereo --output-on-failure
      - name: Gun source and malformed-asset checks
        run: |
          python tools/test_check_gun_assets.py
          python tools/test_gun_source_plans.py
      - name: Control-set resolver checks
        run: python tools/test_control_sets.py
      - name: Native controls and software view checks
        run: |
          cmake -S hub/src/controls -B build-controls -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DAC_CONTROLS_TOML_INCLUDE_DIR=${{ github.workspace }}/build/_deps/tomlplusplus-src/include
          cmake --build build-controls --parallel 2
          ctest --test-dir build-controls --output-on-failure
      - name: Build Windows targets and record four-EXE provenance
        if: runner.os == 'Windows'
        shell: powershell
        run: ./hub/packaging/build-portable-inputs.ps1 -BuildDir build -RepoRoot "$env:GITHUB_WORKSPACE" -AllTargets
      - run: cmake --build build --parallel 2
        if: runner.os != 'Windows'
      - run: ctest --test-dir build --output-on-failure
      - name: Upload Qt test reports and failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hub-test-reports-${{ matrix.os }}
          path: |
            build/Testing/**
            build-*/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - name: Portable provenance and opt-in staging (synthetic PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./hub/packaging/tests/Test-Portable.ps1 -FixtureRoot "$env:GITHUB_WORKSPACE/.local/portable-fixtures"
      - name: Build Windows portable folder and ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./hub/packaging/portable-windows.ps1 -BuildDir build -QtDir "$env:QT_ROOT_DIR" -OutputDir "$env:GITHUB_WORKSPACE/out/$env:AC_PRODUCT_DIR"
      - name: Portable catalog count
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Join-Path ./out $env:AC_PRODUCT_DIR
          & (Join-Path $package 'hubtool.exe') --data-root $package count
          if ($LASTEXITCODE -ne 0) { throw 'Portable catalog count failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: ${{ env.AC_PRODUCT_ARTIFACT }}
          path: out/${{ env.AC_PRODUCT_DIR }}.zip
          if-no-files-found: error
      - name: Keep Qt's offscreen window plugin for the fresh-install check (test only; never packaged)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/test-plugins | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:QT_ROOT_DIR 'plugins/platforms/qoffscreen.dll') -Destination out/test-plugins/qoffscreen.dll
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: fresh-install-test-plugin
          path: out/test-plugins/qoffscreen.dll
          if-no-files-found: error

  # A new user's first hour, without this PC: unpack the Hub package that the hub job built into an empty folder, start
  # it with no game folders, read the first-run Set-up page, run Set-up against folders of fake files, then delete the
  # folder and look for anything left behind. Runs on a bare runner: no Qt, no Visual Studio shell, a throwaway profile.
  fresh-install:
    needs: hub
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read package identity
        shell: python
        run: |
          import json, os, pathlib
          folder = json.loads(pathlib.Path('data/product.json').read_text(encoding='utf-8'))['user_data_folder']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'AC_PRODUCT_DIR={folder}\nAC_PRODUCT_ARTIFACT={folder}-Windows-x64\n')
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.AC_PRODUCT_ARTIFACT }}
          path: package
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fresh-install-test-plugin
          path: plugin
      - name: Install into an empty folder, set up with fake files, uninstall (Windows PowerShell 5.1)
        shell: powershell
        timeout-minutes: 20
        run: ./hub/packaging/tests/Test-FreshInstall.ps1 -PackageZip "$env:GITHUB_WORKSPACE/package/$env:AC_PRODUCT_DIR.zip" -TestPluginDir "$env:GITHUB_WORKSPACE/plugin" -WorkDir "$env:RUNNER_TEMP/fresh" -ArtifactDir "$env:GITHUB_WORKSPACE/fresh-install-evidence"
      - name: Keep the pictures, receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fresh-install-evidence
          path: fresh-install-evidence
          if-no-files-found: warn
