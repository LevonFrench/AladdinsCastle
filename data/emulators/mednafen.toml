# AladdinsCastle emulator/tool manifest. Schema and gate rules: docs/emulator-manifests.md
id = "mednafen"
name = "Mednafen"
kind = "emulator"
upstream = "https://mednafen.github.io/"
license = "GPL-2.0"
license_note = "Libretro mirror COPYING is GPL-2.0 (read 2026-10-08). GitHub metadata for the official website repo mednafen/mednafen.github.io reports no licence, and an earlier research note said GPL-3.0; the two disagree. Confirm the licence from the COPYING file in the source tarball before release."
redistribution = "download-from-upstream-only"
platforms = ["windows-x64", "windows-x86"]
unverified_platforms = []

[install.windows-x64]
do = "download"
url = "https://mednafen.github.io/releases/files/mednafen-1.32.1-win64.zip"
sha256 = "?"
version = "1.32.1"
archive = "zip"
note = "Official site, latest 1.32.1 released 2024-04-05. The page marks the win64 build as Recommended. The site publishes no checksum that was read, so the Hub records sha256 at first download."

[install.windows-x86]
do = "download"
url = "https://mednafen.github.io/releases/files/mednafen-1.32.1-win32.zip"
sha256 = "?"
version = "1.32.1"
archive = "zip"
note = "32-bit Windows build (verified file name)."

[portable]
marker = "env:MEDNAFEN_HOME"
note = "The base directory is MEDNAFEN_HOME if set (official docs). The Hub sets it to the tool folder, so mednafen.cfg and saves stay out of the user profile."

[locate]
exe = ["mednafen.exe"]
version = { from = "?" }
min = "?"

[search]
paths = ["${ProgramFiles}/Mednafen", "${LOCALAPPDATA}/Programs/Mednafen", "${scoop}/apps/mednafen/current", "*:/Emulators/Mednafen*"]

[launch]
args = ["-force_module", "ss", "-video.fs", "1", "${media.file}"]
cwd = "${tool_dir}"
exits_on_game_end = "?"
note = "-force_module is documented upstream. -video.fs comes from RetroBat code. Saturn media is .cue or .chd (RetroBat). Exit behaviour is not verified."

[launch.env]
MEDNAFEN_HOME = "${tool_dir}"

[config]
files = [
  { path = "mednafen.cfg", format = "other", note = "written on shutdown in the base directory" },
  { path = "<FileBase>.ss.cfg", format = "other", note = "per-game settings" },
]

[input.gun]
method = "os-mouse-light-gun"
max_guns = 1
notes = "ss.input.port1 = gun (Light Gun); ss.input.port1.gun_chairs sets the crosshair colour, and 0x1000000 disables it (official ss docs). Default light-gun mouse map: Left = Trigger, Middle = START, Right = Offscreen Shot (simulated). The docs also describe light guns on virtual ports 1 to 12."

[input.wheel]
method = "ss.input.port-wheel"
notes = "ss.input.port<n> = wheel (official docs). Not tested."

[meta]
sources = [
  "https://mednafen.github.io/releases/",
  "https://mednafen.github.io/documentation/",
  "https://github.com/libretro-mirrors/mednafen-git",
]
verified = ["release file names and version (official site, 2026-10-08)", "MEDNAFEN_HOME, -force_module and ss light-gun settings (official docs)", "source mirror licence COPYING (gh contents)"]
unverified = ["official site licence", "checksums", "-video.fs with Windows builds", "exit behaviour"]
checked = "2026-10-08"
confidence = "medium"
