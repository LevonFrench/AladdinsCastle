# AladdinsCastle gun model. Schema and rules: docs/guns.md
id        = "con-pistol-dpad"
name      = "Console pistol with rear d-pad"
family    = "console"            # generic | console | arcade | mounted | special
hold      = "one-hand"          # one-hand | two-hand | mounted
tier      = 1                   # build order: 1 first
model     = "assets/guns/con-pistol-dpad.glb"
source    = "assets/guns/src/con-pistol-dpad.py"
resembles = "Namco GunCon 2 / G-Con 2 for PlayStation 2 (2001): A and B above the trigger, C under the grip, Select and Start on the left of the shaft, d-pad at the rear; black, orange and blue versions"
shape     = "Smaller, rounder pistol; small d-pad on the back where a hammer would be; two buttons above the trigger guard; one button at the bottom of the grip."
length_mm = 225                # design target for our model, not a measurement of the real item
features  = ["laser"]

[tints]                         # our palette; body = main colour, accent = trim
default = "black"
p1      = "orange"
p2      = "blue"
black = { body = "#1b1b1e", accent = "#8a8d93" }
orange = { body = "#f07a1a", accent = "#2a2a2e" }
blue = { body = "#2459c4", accent = "#2a2a2e" }

[[button]]
id    = "a"
label = "A"
node  = "button_a"

[[button]]
id    = "b"
label = "B"
node  = "button_b"

[[button]]
id    = "c"
label = "C"
node  = "button_c"

[[button]]
id    = "select"
label = "Select"
node  = "button_select"

[[button]]
id    = "start"
label = "Start"
node  = "button_start"

[[button]]
id    = "dpad"
label = "D-pad"
node  = "button_dpad"

# Motion ranges use metres (slide) or radians (rotate). Visual recoil never moves the aim anchors.

[motion.trigger]
node = "pivot_trigger"
kind = "rotate"
axis = [-1,0,0]
range = [0,0.35]
drive = "trigger"
lod_nodes = ["pivot_trigger", "pivot_trigger_lod1"]

[motion.button-a]
node = "button_a"
kind = "slide"
axis = [1,0,0]
range = [0,0.002]
drive = "button:a"
lod_nodes = ["button_a", "button_a_lod1"]

[motion.button-b]
node = "button_b"
kind = "slide"
axis = [-1,0,0]
range = [0,0.002]
drive = "button:b"
lod_nodes = ["button_b", "button_b_lod1"]

[motion.button-c]
node = "button_c"
kind = "slide"
axis = [0,1,0]
range = [0,0.002]
drive = "button:c"
lod_nodes = ["button_c", "button_c_lod1"]

[motion.button-select]
node = "button_select"
kind = "slide"
axis = [1,0,0]
range = [0,0.002]
drive = "button:select"
lod_nodes = ["button_select", "button_select_lod1"]

[motion.button-start]
node = "button_start"
kind = "slide"
axis = [1,0,0]
range = [0,0.002]
drive = "button:start"
lod_nodes = ["button_start", "button_start_lod1"]

[motion.button-dpad]
node = "button_dpad"
kind = "slide"
axis = [0,0,-1]
range = [0,0.002]
drive = "button:dpad"
lod_nodes = ["button_dpad", "button_dpad_lod1"]
