# AladdinsCastle gun model. Schema and rules: docs/guns.md
id        = "mnt-mg-heavy"
name      = "Pivot-mounted heavy machine gun"
family    = "mounted"            # generic | console | arcade | mounted | special
hold      = "mounted"          # one-hand | two-hand | mounted
tier      = 1                   # build order: 1 first
model     = "assets/guns/mnt-mg-heavy.glb"
source    = "assets/guns/src/mnt-mg-heavy.py"
resembles = "Cabinet-mounted machine guns (Sega Gunblade NY, L.A. Machineguns and the two-handed guns of Line of Fire; Midway Terminator 2 and Revolution X; SNK Beast Busters; Sega Let's Go Jungle)"
shape     = "Fat barrel shroud on a yoke that turns and tilts, two rear handles or a rear grip plus a top handle, a thumb button on the side."
length_mm = 650                # design target for our model, not a measurement of the real item
features  = ["auto_fire", "rumble", "pivot"]
notes     = "With a gun in each hand each hand holds one gun by its rear grip; the yoke follows."

[tints]                         # our palette; body = main colour, accent = trim
default = "black"
p1      = "red"
p2      = "blue"
black = { body = "#26262a", accent = "#7d8087" }
red = { body = "#c93a2e", accent = "#1c1c20" }
blue = { body = "#2f66cc", accent = "#1c1c20" }

[[button]]
id    = "special"
label = "Special weapon"
node  = "button_special"

# Motion ranges use metres (slide) or radians (rotate). Visual recoil never moves the aim anchors.

[motion.trigger]
node = "pivot_trigger"
kind = "rotate"
axis = [-1,0,0]
range = [0,0.35]
drive = "trigger"
lod_nodes = ["pivot_trigger", "pivot_trigger_lod1"]

[motion.yaw]
node = "pivot_yaw"
kind = "rotate"
axis = [0,1,0]
range = [-0.7,0.7]
drive = "yaw"
lod_nodes = ["pivot_yaw", "pivot_yaw_lod1"]

[motion.pitch]
node = "pivot_pitch"
kind = "rotate"
axis = [1,0,0]
range = [-0.4,0.4]
drive = "pitch"
lod_nodes = ["pivot_pitch", "pivot_pitch_lod1"]

[motion.button-special]
node = "button_special"
kind = "slide"
axis = [-1,0,0]
range = [0,0.002]
drive = "button:special"
lod_nodes = ["button_special", "button_special_lod1"]
