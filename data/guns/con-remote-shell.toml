# SPDX-License-Identifier: GPL-3.0-only
id = "con-remote-shell"
name = "Remote shell"
family = "console"
asset_kind = "gun"
hold = "one-hand"
tier = 1
model = "assets/guns/con-remote-shell.glb"
source = "assets/guns/src/con-remote-shell.py"
resembles = "A white remote-in-barrel shell, held at its forward trigger grip"
shape = "Long flat barrel with a remote-shaped bar, forward trigger grip, open rear handle dropping down and back"
length_mm = 300
features = ["rumble", "rear_dock"]
notes = "Split hold by default; grip_two is the rear docking hold. Two-player mode draws two shells with no accessory. Original authored proportions; no traced or imported content."

[tints]
default = "white"
p1 = "white"
p2 = "white"
white = { body = "#eef0f3", accent = "#aeb5bd" }

[assembly]
default_hold = "split"
accessory_model = "con-stick-grip"
dock_node = "grip_two"
holds = ["split", "docked", "two-remotes"]

[[button]]
id = "a"
label = "A"
node = "button_a"

[[button]]
id = "dpad"
label = "D-pad"
node = "button_dpad"

[[button]]
id = "plus"
label = "+"
node = "button_plus"

[[button]]
id = "minus"
label = "-"
node = "button_minus"

[[button]]
id = "one"
label = "1"
node = "button_one"

[[button]]
id = "two"
label = "2"
node = "button_two"

[[button]]
id = "home"
label = "Home"
node = "button_home"

[motion.trigger]
node = "pivot_trigger"
kind = "rotate"
axis = [-1, 0, 0]
range = [0, 0.3]
drive = "trigger"
lod_nodes = ["pivot_trigger", "pivot_trigger_lod1"]

[motion.button-a]
node = "button_a"
kind = "slide"
axis = [0, -1, 0]
range = [0, 0.002]
drive = "button:a"
lod_nodes = ["button_a", "button_a_lod1"]

[motion.button-dpad]
node = "button_dpad"
kind = "slide"
axis = [0, -1, 0]
range = [0, 0.002]
drive = "button:dpad"
lod_nodes = ["button_dpad", "button_dpad_lod1"]

[motion.button-plus]
node = "button_plus"
kind = "slide"
axis = [0, -1, 0]
range = [0, 0.002]
drive = "button:plus"
lod_nodes = ["button_plus", "button_plus_lod1"]

[motion.button-minus]
node = "button_minus"
kind = "slide"
axis = [0, -1, 0]
range = [0, 0.002]
drive = "button:minus"
lod_nodes = ["button_minus", "button_minus_lod1"]

[motion.button-one]
node = "button_one"
kind = "slide"
axis = [0, -1, 0]
range = [0, 0.002]
drive = "button:one"
lod_nodes = ["button_one", "button_one_lod1"]

[motion.button-two]
node = "button_two"
kind = "slide"
axis = [0, -1, 0]
range = [0, 0.002]
drive = "button:two"
lod_nodes = ["button_two", "button_two_lod1"]

[motion.button-home]
node = "button_home"
kind = "slide"
axis = [0, -1, 0]
range = [0, 0.002]
drive = "button:home"
lod_nodes = ["button_home", "button_home_lod1"]
