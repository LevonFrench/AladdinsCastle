# AladdinsCastle gun model. Schema and rules: docs/guns.md
id        = "generic-pistol"
name      = "Plain arcade pistol"
family    = "generic"            # generic | console | arcade | mounted | special
hold      = "one-hand"          # one-hand | two-hand | mounted
tier      = 1                   # build order: 1 first
model     = "assets/guns/generic-pistol.glb"
source    = "assets/guns/src/generic-pistol.py"
resembles = "Nothing in particular: the fallback when a game has no better match"
shape     = "Compact semi-automatic outline with a thick grip and a short flat-topped barrel."
length_mm = 230                # design target for our model, not a measurement of the real item
features  = ["laser"]

[tints]                         # our palette; body = main colour, accent = trim
default = "red"
p1      = "red"
p2      = "blue"
red = { body = "#c8322b", accent = "#1c1c20" }
blue = { body = "#2f6fd6", accent = "#1c1c20" }
grey = { body = "#8a8d93", accent = "#1c1c20" }
