id = "panel-action-three"
title = "3-button arcade action panel"
model = "assets/controls/panel-action-three.glb"
license = "CC0-1.0"
units = "metres"
up = "+Y"
forward = "-Z"
anchor = "control_root"
materials = ["body", "accent", "dark", "glass"]
lod0_budget = 8000
lod1_budget = 2000

[[button]]
id = "action-1"
node = "button_action_1"
label_node = "label_action_1"

[motion.action_1]
node = "button_action_1"
lod_nodes = ["button_action_1", "button_action_1_lod1"]
kind = "slide"
axis = [0, -1, 0]
range = [0, 0.003]
drive = "button:action-1"

