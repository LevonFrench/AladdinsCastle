[[action]]
id="nudge"
part="Left stick"
label="Nudge (X/Y)"
hand="left"
control="thumbstick"
target="nudgeDisplacementX/nudgeDisplacementY"
reason="Native XR nudge sensors are mapped; this tag clears plugin stateMask. Host analog bridge pending."
[[action]]
id="recenter"
part="Left stick click"
label="Recenter — unavailable"
hand="left"
control="click"
target="VRRecenter"
state="unavailable"
reason="Enum exists, but this tag comments out the plugin action map. No callable recenter bridge."
[[action]]
id="plunger"
part="Right stick"
label="Plunger (Y)"
hand="right"
control="thumbstick"
target="plungerPosition"
reason="Native XR plunger sensor is mapped; this tag clears plugin stateMask. Host analog bridge pending."
scale=-1.0
[[action]]
id="launch"
part="Right stick click"
label="Launch ball"
hand="right"
control="click"
target="LaunchBall"
