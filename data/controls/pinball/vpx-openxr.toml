[[action]]
id="left-flipper"
part="Left trigger"
label="Left flipper"
hand="left"
control="trigger"
target="LeftFlipper"
threshold=0.3
staged_threshold=0.6
[[action]]
id="right-flipper"
part="Right trigger"
label="Right flipper"
hand="right"
control="trigger"
target="RightFlipper"
threshold=0.3
staged_threshold=0.6
[[action]]
id="left-magnasave"
part="Left grip"
label="Left MagnaSave (if table supports it)"
hand="left"
control="grip"
target="LeftMagnaSave"
[[action]]
id="right-magnasave"
part="Right grip"
label="Right MagnaSave (if table supports it)"
hand="right"
control="grip"
target="RightMagnaSave"
[[action]]
id="start"
part="A"
label="Start"
hand="right"
control="primary"
target="StartGame"
[[action]]
id="coin"
part="B"
label="Insert coin"
hand="right"
control="secondary"
target="AddCredit"
[[action]]
id="menu"
part="X"
label="Open menu"
hand="left"
control="primary"
target="OpenInGameUI"
[[action]]
id="exit"
part="Y — EXIT"
label="WARNING: exits the current table"
hand="left"
control="secondary"
target="ExitGame"
