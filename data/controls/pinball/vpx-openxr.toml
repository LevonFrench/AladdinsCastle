# Source-backed controller policy under the universal controls contract v1 (2026-10-25); execution awaits live acceptance.
version = "pinball-controls/1"
id = "vpx-openxr"
title = "Pinball controls — VPX OpenXR"
source_commit = "af26b2d9392b4c9ec3e3edff4bbd69562085a44c"
sources = ["src/input/XRInputHandler.h:54", "src/input/XRInputHandler.h:125", "src/core/VPXPluginAPIImpl.cpp:135", "src/core/VPXPluginAPIImpl.cpp:558", "plugins/plugins/VPXPlugin.h:243", "VPinballX 10.8 BGFX build: Mapping.VRControllerCalibration (Align VR view using controllers), Mapping.VRCenter, ControllerLockbarScale"]
runtime_bridge = "planned"

[[action]]
id="left-flipper"
part="Left trigger"
label="Left flipper"
hand="left"
control="trigger"
target="LeftFlipper"
threshold=0.3
staged_threshold=0.6
[[action]]
id="right-flipper"
part="Right trigger"
label="Right flipper"
hand="right"
control="trigger"
target="RightFlipper"
threshold=0.3
staged_threshold=0.6
[[action]]
id="left-magnasave"
part="Left grip"
label="Left MagnaSave (if table supports it)"
hand="left"
control="grip"
target="LeftMagnaSave"
[[action]]
id="right-magnasave"
part="Right grip"
label="Right MagnaSave (if table supports it)"
hand="right"
control="grip"
target="RightMagnaSave"
[[action]]
id="start"
part="Left stick click"
label="Start (U1)"
hand="left"
control="click"
target="StartGame"
[[action]]
id="coin"
part="Right stick click"
label="Insert coin (U2)"
hand="right"
control="click"
target="AddCredit"
[[action]]
id="launch"
part="A"
label="Launch ball (plunger button)"
hand="right"
control="primary"
target="LaunchBall"
[[action]]
id="menu"
part="X"
label="Open menu"
hand="left"
control="primary"
target="OpenInGameUI"
[[action]]
id="exit"
part="Left Menu, then the Hub panel (or Esc)"
label="Exit game (no U4 in pinball): the Hub closes the table the ordinary way"
hand="left"
control="click"
target="ExitGame"
warning=true
reason="Hold-to-quit (U4) works only in the patched AladdinsCastle build of VPX (setups/vpx-vr): both stick clicks held for 3 s with hand travel under 5 cm close the table through VPX's own Exit Game, so NVRAM and settings are saved. Standard VPX exits on press and cannot time a hold, and the Hub cannot read the controllers while VPX has them: press the left Menu button (SteamVR dashboard), then the Hub panel's Exit game, or press Esc. Both stick clicks held while the hands move only adjust the table (U3p)."
[[action]]
id="nudge"
part="Left stick"
label="Nudge (X/Y)"
hand="left"
control="thumbstick"
target="nudgeDisplacementX/nudgeDisplacementY"
reason="Native XR nudge sensors are mapped; this tag clears plugin stateMask. Host analog bridge pending."
[[action]]
id="recenter"
part="Both stick clicks"
label="Recentre the table (U3)"
hand="left"
control="click"
target="VRControllerCalibration"
reason="VPX's own Align VR view using controllers. It seats the table at the hands, not in front of the head; no timing window, so Start and Coin can fire before the second click."
[[action]]
id="table-adjust"
part="Both stick clicks, held"
label="Scale, turn and move the table (U3p): hands apart or together, turn the pair, move both; release to keep"
hand="right"
control="click"
target="VRControllerCalibration"
reason="Same VPX action as Recentre, while both clicks stay held. Scale uses ControllerLockbarScale; Hub passes it unchanged."
[[action]]
id="plunger"
part="Right stick"
label="Plunger (Y)"
hand="right"
control="thumbstick"
target="plungerPosition"
reason="Native XR plunger sensor is mapped; this tag clears plugin stateMask. Host analog bridge pending."
scale=-1.0
