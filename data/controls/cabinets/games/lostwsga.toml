# Existing versionless cabinet format from config-spec section 5.
id = "model3-lostwsga"
title = "The Lost World: Jurassic Park cabinet"
seat = { height_m = 0.55, posture = "seated" }

[[element]]
id = "p1-aim-x"
label = "Aim horizontal"
type = "pistol"
source = "right_hand"
node = "muzzle"
output = { axis = "AnalogGunX", range = [0, 255], centre = 128, invert = false }
model = "arc-pistol-twin"
player = 0
slot = 0
position = [0.24, 0.75, -0.4]
grab = { required = false, button = "grip", soft_lock = true }
tracking_loss = "freeze_then_neutral"
axes = { component = "x", positive = "right" }
extractor = "aim_ray"
aim = { projection = "original_game_view", hit = "scene_depth_or_geometry", outside = "clamp_to_edge_no_Offscreen_port", anchor = "muzzle", pose = "aim_orientation_at_grip_position", firing_hand = "right" }
hold = { firing_hand = "right", offhand = "none", attach_node = "grip" }
model_instance = "arc-pistol-twin-p1"
label_node = "muzzle"

[[element]]
id = "p1-aim-y"
label = "Aim vertical"
type = "pistol"
source = "right_hand"
node = "muzzle"
output = { axis = "AnalogGunY", range = [0, 255], centre = 128, invert = false }
model = "arc-pistol-twin"
player = 0
slot = 0
position = [0.24, 0.75, -0.4]
grab = { required = false, button = "grip", soft_lock = true }
tracking_loss = "freeze_then_neutral"
axes = { component = "y", positive = "up" }
extractor = "aim_ray"
aim = { projection = "original_game_view", hit = "scene_depth_or_geometry", outside = "clamp_to_edge_no_Offscreen_port", anchor = "muzzle", pose = "aim_orientation_at_grip_position", firing_hand = "right" }
hold = { firing_hand = "right", offhand = "none", attach_node = "grip" }
model_instance = "arc-pistol-twin-p1"
label_node = "muzzle"

[[element]]
id = "p1-main-trigger"
label = "Main trigger"
type = "button"
source = "right_trigger"
node = "pivot_trigger"
output = { button = "AnalogTriggerLeft", range = [0, 1] }
player = 0
slot = 0
model = "arc-pistol-twin"
binding = { mode = "hold", threshold = 0.55 }
game_action_question = "Confirm each trigger switch caption in the game instructions."
model_instance = "arc-pistol-twin-p1"
position = [0.24, 0.75, -0.4]
label_node = "pivot_trigger"

[[element]]
id = "p1-second-trigger"
label = "Second trigger"
type = "button"
source = "right_primary"
node = ""
output = { button = "AnalogTriggerRight", range = [0, 1] }
player = 0
slot = 0
model = "arc-pistol-twin"
binding = { mode = "hold", threshold = 0.55 }
game_action_question = "Confirm each trigger switch caption in the game instructions."
model_instance = "arc-pistol-twin-p1"
position = [0.24, 0.75, -0.4]
label_node = ""

[[element]]
id = "p1-start"
label = "Start"
type = "button"
source = "left_thumbstick_click"
node = ""
output = { button = "Start1", range = [0, 1] }
player = 0
slot = 0
model = "arc-pistol-twin"
binding = { mode = "press", threshold = 0.55 }
game_action_question = ""
model_instance = "arc-pistol-twin-p1"
position = [0.24, 0.75, -0.4]
label_node = ""

[[element]]
id = "p1-coin"
label = "Insert credit"
type = "button"
source = "right_thumbstick_click"
node = ""
output = { button = "Coin1", range = [0, 1] }
player = 0
slot = 0
model = "arc-pistol-twin"
binding = { mode = "press", threshold = 0.55 }
game_action_question = ""
model_instance = "arc-pistol-twin-p1"
position = [0.24, 0.75, -0.4]
label_node = ""

