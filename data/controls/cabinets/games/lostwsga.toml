[hold]
default = "cab-pistol-two-guns"

[holds.cab-pistol-two-guns]
title = "Pistol / two guns"
description = "Right hand controls player 1; left hand controls player 2 independently."
control_set = "cab-pistol-two-guns"
default = true
picture_light = "assets/controls/cards/cab-pistol-two-guns-light.svg"
picture_dark = "assets/controls/cards/cab-pistol-two-guns-dark.svg"

[holds.cab-pistol-two-hand]
title = "Pistol / two hand"
description = "Hold one gun with both hands for player 1, with the other player inactive."
control_set = "cab-pistol-two-hand"
default = false
picture_light = "assets/controls/cards/cab-pistol-two-hand-light.svg"
picture_dark = "assets/controls/cards/cab-pistol-two-hand-dark.svg"

[holds.cab-pistol-single-gun]
title = "Pistol / single gun"
description = "Use one gun in the right hand; left hand is free."
control_set = "cab-pistol-single-gun"
default = false
picture_light = "assets/controls/cards/cab-pistol-single-gun-light.svg"
picture_dark = "assets/controls/cards/cab-pistol-single-gun-dark.svg"
