# Existing versionless cabinet format from config-spec section 5.
id = "model3-vf3"
title = "Virtua Fighter 3 cabinet"
seat = { height_m = 0.55, posture = "seated" }

[[element]]
id = "joy-up"
label = "Move up"
type = "stick"
source = "left_thumbstick"
node = "pivot_stick_y"
output = { button = "JoyUp", range = [0, 1] }
model = "stick-arcade"
position = [-0.18, 0.63, -0.36]
extractor = "stick"
axes = { component = "y", positive = "forward/up" }
binding = { direction = "up", threshold = 0.55, release_threshold = 0.35, mode = "hold" }
calibration = { centre = "before_launch", range_deg = [-15, 15] }
curve = { deadzone = 0.08, gamma = 1 }
direction = { sign = 1, opposites = "neutral", diagonals = "allow" }
grab = { required = false, button = "left_grip", radius_m = 0.06, soft_lock = true, anchors = ["grab_knob"] }
tracking_loss = "neutral"
model_instance = "stick-arcade-p1"
label_node = "label_joystick"

[[element]]
id = "joy-down"
label = "Move down"
type = "stick"
source = "left_thumbstick"
node = "pivot_stick_y"
output = { button = "JoyDown", range = [0, 1] }
model = "stick-arcade"
position = [-0.18, 0.63, -0.36]
extractor = "stick"
axes = { component = "y", positive = "forward/up" }
binding = { direction = "down", threshold = 0.55, release_threshold = 0.35, mode = "hold" }
calibration = { centre = "before_launch", range_deg = [-15, 15] }
curve = { deadzone = 0.08, gamma = 1 }
direction = { sign = -1, opposites = "neutral", diagonals = "allow" }
grab = { required = false, button = "left_grip", radius_m = 0.06, soft_lock = true, anchors = ["grab_knob"] }
tracking_loss = "neutral"
model_instance = "stick-arcade-p1"
label_node = "label_joystick"

[[element]]
id = "joy-left"
label = "Move left"
type = "stick"
source = "left_thumbstick"
node = "pivot_stick_x"
output = { button = "JoyLeft", range = [0, 1] }
model = "stick-arcade"
position = [-0.18, 0.63, -0.36]
extractor = "stick"
axes = { component = "x", positive = "right" }
binding = { direction = "left", threshold = 0.55, release_threshold = 0.35, mode = "hold" }
calibration = { centre = "before_launch", range_deg = [-15, 15] }
curve = { deadzone = 0.08, gamma = 1 }
direction = { sign = -1, opposites = "neutral", diagonals = "allow" }
grab = { required = false, button = "left_grip", radius_m = 0.06, soft_lock = true, anchors = ["grab_knob"] }
tracking_loss = "neutral"
model_instance = "stick-arcade-p1"
label_node = "label_joystick"

[[element]]
id = "joy-right"
label = "Move right"
type = "stick"
source = "left_thumbstick"
node = "pivot_stick_x"
output = { button = "JoyRight", range = [0, 1] }
model = "stick-arcade"
position = [-0.18, 0.63, -0.36]
extractor = "stick"
axes = { component = "x", positive = "right" }
binding = { direction = "right", threshold = 0.55, release_threshold = 0.35, mode = "hold" }
calibration = { centre = "before_launch", range_deg = [-15, 15] }
curve = { deadzone = 0.08, gamma = 1 }
direction = { sign = 1, opposites = "neutral", diagonals = "allow" }
grab = { required = false, button = "left_grip", radius_m = 0.06, soft_lock = true, anchors = ["grab_knob"] }
tracking_loss = "neutral"
model_instance = "stick-arcade-p1"
label_node = "label_joystick"

[[element]]
id = "action-1"
label = "Punch"
type = "button"
source = "right_trigger"
node = "button_action_1"
output = { button = "Punch", range = [0, 1] }
model = "panel-action-four"
position = [0.09, 0.63, -0.36]
binding = { mode = "hold", threshold = 0.55 }
model_instance = "panel-action-four-p1"
label_node = "label_action_1"

[[element]]
id = "action-2"
label = "Kick"
type = "button"
source = "right_primary"
node = "button_action_2"
output = { button = "Kick", range = [0, 1] }
model = "panel-action-four"
position = [0.09, 0.63, -0.36]
binding = { mode = "hold", threshold = 0.55 }
model_instance = "panel-action-four-p1"
label_node = "label_action_2"

[[element]]
id = "action-3"
label = "Guard"
type = "button"
source = "left_trigger"
node = "button_action_3"
output = { button = "Guard", range = [0, 1] }
model = "panel-action-four"
position = [0.09, 0.63, -0.36]
binding = { mode = "hold", threshold = 0.55 }
model_instance = "panel-action-four-p1"
label_node = "label_action_3"

[[element]]
id = "action-4"
label = "Escape"
type = "button"
source = "right_secondary"
node = "button_action_4"
output = { button = "Escape", range = [0, 1] }
model = "panel-action-four"
position = [0.09, 0.63, -0.36]
binding = { mode = "hold", threshold = 0.55 }
model_instance = "panel-action-four-p1"
label_node = "label_action_4"

[[element]]
id = "start"
label = "Start / first-person view"
type = "button"
source = "right_thumbstick_click"
node = ""
output = { button = "Start1", range = [0, 1] }
binding = { mode = "press" }

[[element]]
id = "coin"
label = "Insert credit"
type = "button"
source = "left_secondary"
node = ""
output = { button = "Coin1", range = [0, 1] }
binding = { mode = "press" }

[hold]
default = "cab-arcade-vf3-thumbstick"

[holds.cab-arcade-vf3-thumbstick]
title = "Virtua Fighter 3 / thumbstick"
description = "Move with the left thumbstick; use separate buttons for every action."
control_set = "cab-arcade-vf3-thumbstick"
default = true
picture_light = "assets/controls/cards/cab-arcade-vf3-thumbstick-light.svg"
picture_dark = "assets/controls/cards/cab-arcade-vf3-thumbstick-dark.svg"

[holds.cab-arcade-vf3-grab-stick]
title = "Virtua Fighter 3 / grab stick"
description = "Grip and tilt the arcade stick with your left hand; use separate action buttons."
control_set = "cab-arcade-vf3-grab-stick"
default = false
picture_light = "assets/controls/cards/cab-arcade-vf3-grab-stick-light.svg"
picture_dark = "assets/controls/cards/cab-arcade-vf3-grab-stick-dark.svg"
