# Existing versionless cabinet format from config-spec section 5.
id = "cab-flight-thumbstick"
title = "Flight stick / thumbstick"
seat = { height_m = 0.55, posture = "seated" }

[[element]]
id = "stick-x"
label = "Aim left/right"
type = "stick"
source = "left_thumbstick"
node = "pivot_stick_x"
output = { axis = "AnalogJoyX", range = [0, 255], centre = 128, invert = false }
model = "stick-flight"
position = [0.15, 0.58, -0.35]
extractor = "stick"
axes = { component = "x", positive = "right" }
calibration = { centre = "before_launch", range_deg = [-20, 20] }
curve = { deadzone = 0.05, gamma = 1 }
spring = { return_speed = 6 }
tracking_loss = "neutral"
grab = { required = false, button = "right_grip", radius_m = 0.06, soft_lock = true }
model_instance = "stick-flight-p1"
label_node = "label_stick"

[[element]]
id = "stick-y"
label = "Aim up/down"
type = "stick"
source = "left_thumbstick"
node = "pivot_stick_y"
output = { axis = "AnalogJoyY", range = [0, 255], centre = 128, invert = true }
model = "stick-flight"
position = [0.15, 0.58, -0.35]
extractor = "stick"
axes = { component = "y", positive = "up" }
calibration = { centre = "before_launch", range_deg = [-20, 20] }
curve = { deadzone = 0.05, gamma = 1 }
spring = { return_speed = 6 }
tracking_loss = "neutral"
grab = { required = false, button = "right_grip", radius_m = 0.06, soft_lock = true }
model_instance = "stick-flight-p1"
label_node = "label_stick"

[[element]]
id = "fire"
label = "Fire"
type = "button"
source = "right_trigger"
node = "pivot_trigger"
output = { button = "AnalogJoyTrigger", range = [0, 1] }
model = "stick-flight"
binding = { threshold = 0.55, mode = "hold" }
model_instance = "stick-flight-p1"
position = [0.15, 0.58, -0.35]
label_node = "label_trigger"

[[element]]
id = "event"
label = "Event"
type = "button"
source = "right_primary"
node = "button_event"
output = { button = "AnalogJoyEvent", range = [0, 1] }
model = "stick-flight"
binding = { mode = "hold" }
model_instance = "stick-flight-p1"
position = [0.15, 0.58, -0.35]
label_node = "label_event"

[[element]]
id = "start"
label = "Start"
type = "button"
source = "left_thumbstick_click"
node = ""
output = { button = "Start1", range = [0, 1] }
binding = { mode = "press" }

[[element]]
id = "coin"
label = "Insert credit"
type = "button"
source = "right_thumbstick_click"
node = ""
output = { button = "Coin1", range = [0, 1] }
binding = { mode = "press" }
