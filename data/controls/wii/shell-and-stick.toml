# SPDX-License-Identifier: GPL-3.0-only
# Original control policy. No game-layout assertions are made here.
version = "shell-stick/1"
id = "shell-and-stick"
shell = "con-remote-shell"
stick = "con-stick-grip"
default_hold = "split"
primary_hands = ["right", "left"]
recenter_chord = ["right.click", "left.click"]
recenter_suppresses_game_buttons = true
# Universal controls contract v1: no expression below uses a stick click. Left click is Start
# (Plus) and right click is Select (Minus) on the native route (tools/wii_shell_stick.py adds
# them from setups/dolphin-vr/motion-controls/universal_controls.py); both held 3 s quits through
# the Hotkeys.ini template. The "click" token stays in the vocabulary for the DSU bridge.

[holds.split]
shell_hand = "firing"
stick_hand = "other"
aim = "firing_aim"
[holds.docked]
shell_hand = "firing"
stick_hand = "grip_two"
aim = "two_hand"
attach_node = "grip_two"
attach_policy = "proximity"
accessory_rotation_xyzw = [-0.3826834324, 0.0, 0.0, 0.9238795325]
detach_distance_m = 0.12
attach_distance_m = 0.06
grab_modes = ["hold", "toggle"]
[holds.two-remotes]
shell_hand = "each"
stick_hand = "none"
aim = "each_aim"

[native]
device = "OpenXR/0/OpenXR Controller"
trigger = "{hand} Trigger"
grip = "({hand} Button Squeeze | {hand} Squeeze)"
click = "{hand} Button Thumbstick"
up = "{hand} Thumbstick Y+"
down = "{hand} Thumbstick Y-"
left = "{hand} Thumbstick X-"
right = "{hand} Thumbstick X+"
right_primary = "Right Button A"
right_secondary = "Right Button B"
left_primary = "Left Button X"
left_secondary = "Left Button Y"
accel = "{hand} Raw Accel {direction}"
gyro = "{hand} Raw Gyro {direction}"

[dsu]
device = "DSUClient/{slot}/{server}"
pointer = "Right"
stick = "Left"
accel = "Accel {direction}"
gyro = "Gyro {direction}"
scripted_buttons = ["Share", "L3", "R3", "Options", "Pad N", "Pad E", "Pad S", "Pad W", "L2", "R2", "L1", "R1", "Triangle", "Circle", "Cross", "Square"]

# Expressions are boolean token trees, with explicit suppression of the base
# action in each modifier layer. A single compiler feeds view/profile/bridge.
[[action]]
id="fire"
part="Remote B trigger"
role="remote"
node="pivot_trigger"
ini="Buttons/B"
wire="R2"
split="trigger & !grip"
dual="trigger & !secondary"
[[action]]
id="interact"
part="Remote A button"
role="remote"
node="button_a"
ini="Buttons/A"
wire="Cross"
split="primary & !grip"
dual="primary & !secondary & !grip"
[[action]]
id="dpad-up"
part="Remote d-pad up"
role="remote"
node="button_dpad"
ini="D-Pad/Up"
wire="Pad N"
split="up & !grip"
dual="secondary & up & !primary"
[[action]]
id="dpad-down"
part="Remote d-pad down"
role="remote"
node="button_dpad"
ini="D-Pad/Down"
wire="Pad S"
split="down & !grip"
dual="secondary & down & !primary"
[[action]]
id="dpad-left"
part="Remote d-pad left"
role="remote"
node="button_dpad"
ini="D-Pad/Left"
wire="Pad W"
split="left & !grip"
dual="secondary & left & !primary"
[[action]]
id="dpad-right"
part="Remote d-pad right"
role="remote"
node="button_dpad"
ini="D-Pad/Right"
wire="Pad E"
split="right & !grip"
dual="secondary & right & !primary"
[[action]]
id="menu"
part="Remote plus button"
role="remote"
node="button_plus"
ini="Buttons/+"
wire="Options"
split="grip & primary"
dual="secondary & primary & right"
[[action]]
id="minus"
part="Remote minus button"
role="remote"
node="button_minus"
ini="Buttons/-"
wire="Share"
split="grip & secondary"
dual="secondary & primary & left"
[[action]]
id="one"
part="Remote 1 button"
role="remote"
node="button_one"
ini="Buttons/1"
wire="Square"
split="grip & up"
dual="secondary & primary & up"
[[action]]
id="two"
part="Remote 2 button"
role="remote"
node="button_two"
ini="Buttons/2"
wire="Triangle"
split="grip & down"
dual="secondary & primary & down"
[[action]]
id="home"
part="Remote Home button"
role="remote"
node="button_home"
ini="Buttons/Home"
wire="PS"
split="grip & left"
dual="secondary & grip & !primary & !trigger"
[[action]]
id="z"
part="Stick controller Z button"
role="nunchuk"
node="button_z"
ini="Nunchuk/Buttons/Z"
wire="L2"
split="trigger"
dual="grip & !secondary & !primary"
[[action]]
id="c"
part="Stick controller C button"
role="nunchuk"
node="button_c"
ini="Nunchuk/Buttons/C"
wire="Circle"
split="grip"
dual="grip & primary & !secondary"
[[action]]
id="stick-up"
part="Analog stick up"
role="nunchuk"
node="button_stick"
ini="Nunchuk/Stick/Up"
wire="Left Y+"
split="up"
dual="up & !secondary"
[[action]]
id="stick-down"
part="Analog stick down"
role="nunchuk"
node="button_stick"
ini="Nunchuk/Stick/Down"
wire="Left Y-"
split="down"
dual="down & !secondary"
[[action]]
id="stick-left"
part="Analog stick left"
role="nunchuk"
node="button_stick"
ini="Nunchuk/Stick/Left"
wire="Left X-"
split="left"
dual="left & !secondary"
[[action]]
id="stick-right"
part="Analog stick right"
role="nunchuk"
node="button_stick"
ini="Nunchuk/Stick/Right"
wire="Left X+"
split="right"
dual="right & !secondary"
[[action]]
id="remote-shake"
part="Shake the shell"
role="remote"
node="grip"
ini="Shake/X"
wire="R1"
split="secondary & !grip"
dual="secondary & trigger & !grip"
motion="shake"
[[action]]
id="remote-swing"
part="Swing the shell"
role="remote"
node="grip"
ini="Swing/Forward"
wire="L1"
split="grip & right"
dual="secondary & trigger & grip"
motion="swing"
[[action]]
id="stick-shake"
part="Shake the stick controller"
role="nunchuk"
node="grip"
ini="Nunchuk/Shake/X"
wire="R3"
split="primary"
dual="secondary & primary & trigger"
motion="shake"
[[action]]
id="stick-swing"
part="Swing the stick controller"
role="nunchuk"
node="grip"
ini="Nunchuk/Swing/Forward"
wire="L3"
split="secondary"
dual="secondary & primary & grip & !trigger"
motion="swing"
