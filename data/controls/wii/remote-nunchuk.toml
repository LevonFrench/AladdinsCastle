# SPDX-License-Identifier: GPL-3.0-only
version = "0.1"

[transport]
server_description = "AladdinsCastle"
slots = ["right", "left"]
pointer = "right_stick"
nunchuk_stick = "left_stick"
acceleration_units = "g"
gyro_units = "degrees_per_second"
motion_input = true
shake_binding = false
swing_binding = false
pointer_relative = false
pointer_auto_hide = false
rumble = false
pointer_steps = 256

[[element]]
id = "aim"
part = "Remote IR sensor"
label = "Aim: point the gun"
control = "pointer"
target = "right_stick"
role = "remote"
node = "muzzle"
mode = "hold"

[[element]]
id = "fire"
part = "Remote B trigger"
label = "Fire"
control = "trigger"
target = "r2"
role = "remote"
node = "pivot_trigger"
mode = "hold"

[[element]]
id = "interact"
part = "Remote A button"
label = "A: pick up / interact"
control = "primary"
target = "cross"
role = "remote"

[[element]]
id = "z"
part = "Nunchuk Z button"
label = "Z: context action"
control = "grip"
target = "l2"
role = "nunchuk"
mode = "hold"

[[element]]
id = "c"
part = "Nunchuk C button"
label = "C: context action"
control = "secondary"
target = "circle"
role = "nunchuk"

[[element]]
id = "stick"
part = "Nunchuk stick"
label = "Look / game navigation"
control = "thumbstick"
target = "left_stick"
role = "nunchuk"
mode = "hold"

[[element]]
id = "menu"
part = "Remote + button"
label = "+: game menu / command"
control = "menu"
target = "options"
role = "remote"

[[element]]
id = "dpad"
part = "Remote directional pad"
label = "Directional game commands"
control = "dpad"
target = "dpad"
role = "remote"

[[element]]
id = "minus"
part = "Remote - button"
label = "-: game command"
control = "keyboard_minus"
target = "share"
role = "remote"

[[element]]
id = "one"
part = "Remote 1 button"
label = "1: game command"
control = "keyboard_one"
target = "square"
role = "remote"

[[element]]
id = "two"
part = "Remote 2 button"
label = "2: game command"
control = "keyboard_two"
target = "triangle"
role = "remote"

[[element]]
id = "motion"
part = "Remote accelerometer and gyro"
label = "Move / shake / swing the gun"
control = "remote_motion"
target = "accelerometer_gyro"
role = "remote"
node = "grip"
mode = "hold"

[[element]]
id = "nunchuk-motion"
part = "Nunchuk accelerometer"
label = "Move the Nunchuk hand"
control = "nunchuk_motion"
target = "nunchuk_acceleration"
role = "nunchuk"
mode = "hold"

[[element]]
id = "reload-fallback"
part = "Seated reload button"
label = "Reload motion: R in bridge window / Ctrl+Alt+R in Dolphin"
control = "reload_fallback"
target = "inject_remote_shake"
role = "local"

[[element]]
id = "melee-fallback"
part = "Seated melee button"
label = "Swing motion: V / Ctrl+Alt+V; hold the game's knife button if needed"
control = "melee_fallback"
target = "inject_remote_swing"
role = "local"

[[element]]
id = "laser"
part = "Gun laser"
label = "Toggle laser"
control = "thumbstick_click"
target = "laser_toggle"
role = "local"
node = "fx_laser"
