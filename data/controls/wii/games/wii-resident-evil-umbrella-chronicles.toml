# SPDX-License-Identifier: GPL-3.0-only
# Await owner-selected option/instruction screens. No inferred game actions.
version = "0.1"
game_id = "wii-resident-evil-umbrella-chronicles"
control_set = "shell-and-stick"
layout = { state = "question", name = "", question = "Which game option-screen layout is selected for shell and stick?" }
questions = ["Confirm knife-enable and grenade chord in the selected game control layout.", "Confirm C weapon selection and Z meaning in the selected layout.", "Confirm every Remote button, stick/C/Z action and shake/swing prompt in that selected layout."]
sources = []

[gun_proposal]
state = "proposed"
model = "game-pistol-service"
rationale = "Original service pistol shared by both Resident Evil games; neutral metal and dark grip with small player-colour inlays. Exact weapon and fit remain owner choices."

[hold]
default = "split"
state = "provisional"

[reload]
choices = ["shake", "flick-down", "offscreen", "button"]
selected = "shake"
state = "question"
question = "Shake is the documented starting choice; confirm the selected game layout."
target_action = "remote-shake"
button_fallback = "remote-shake"

[aim_calibration]
version = "wii-aim/1"
state = "desktop-verified"
total_yaw_degrees = 15.46
total_pitch_degrees = 11.51
vertical_offset_cm = 15
emulated_distance_m = 2
native = "provisional-opt-in"

[aim_calibration.evidence]
method = "nine-point"
samples = 9
independent_review = true
scope = "approximate-desktop-dsu"
pointer_extent = 0.8
input_domain = [-0.8, 0.8]
target_rms_px = 4.525
target_max_error_px = 9.964
notes = "All measured points visible; lower-corner residual nonlinearity remains. Full range, shot impacts and native headset/controller geometry are unverified."
