[[gradient.list_banner_fade.stop]]
color = "#000f0f15"
pos = 0.75

[gradient.explore_banner_fade]  # 01 1.8 eight stops, Window.Layout.ps1:1155-1177. Positions are an even spread 0 to 0.85 (inferred; check the source)
[[gradient.explore_banner_fade.stop]]
color = "#f00f0f15"
pos = 0.0000
[[gradient.explore_banner_fade.stop]]
color = "#e60f0f15"
pos = 0.1214
[[gradient.explore_banner_fade.stop]]
color = "#cc0f0f15"
pos = 0.2429
[[gradient.explore_banner_fade.stop]]
color = "#a60f0f15"
pos = 0.3643
[[gradient.explore_banner_fade.stop]]
color = "#7a0f0f15"
pos = 0.4857
[[gradient.explore_banner_fade.stop]]
color = "#4e0f0f15"
pos = 0.6071
[[gradient.explore_banner_fade.stop]]
color = "#260f0f15"
pos = 0.7286
[[gradient.explore_banner_fade.stop]]
color = "#000f0f15"
pos = 0.8500

[gradient.hero_edge]            # 03 1.2 row 5. Accent edges on wide windows
alpha = 150                     # accent at alpha 150 (0x96)
fade_from = 0.22                # fades to 0 between these stops
fade_to = 0.78

[gradient.wash]                 # 01 1.6 "Colour wash". Computed at runtime from [hub].accent (Core/Modules/OverviewPage.ps1:636-694). Not stored
stop_pos = [0.00, 0.30, 0.66, 1.00]   # deep, deep, mid, amber
stop_value = [28, 28, 78, 115]        # HSV V (0-255) per stop
deolive_pull = [0.65, 0.65, 0.50, 0.20]  # pull hue toward hue_target when hue is in deolive_hue_range
deolive_hue_range = [35, 78]
hue_target = 28
sat_cap = 0.85

# ---------------------------------------------------------------- formulas (runtime colour maths)

[formula.luminance]             # perceived luminance, Rec. 601 weights, range 0-255 (Core/Modules/Helpers.ps1:1513-1527)
weight_r = 0.299
weight_g = 0.587
weight_b = 0.114

[formula.tint]                  # 02 1.5 flat tint of the card. a = (top + mid) / 2 = 0.06
top_alpha = 0.10
mid_alpha = 0.02
lift_below_alpha = 0.09         # if a < 0.09 and lum < 0.45, lift dark accents
lift_below_lum = 0.45
lift_factor = 0.30

[formula.border]                # 02 1.5 card border = accent * 0.22 + base * 0.78
accent_mix = 0.22

[formula.pill]                  # 02 1.5 family pill fill and text
fill_accent_mix = 0.18          # fill = accent * 0.18 + pill * 0.82
text_accent_mix = 0.50          # text = accent * 0.5 + white * 0.5

[formula.neon]                  # 02 1.5 neon button and glow. Hub GetGlowColor scales channels by min_lum / lum and clamps at 255 (one pass)
lift_min_lum = 140
dim = 0.90
glow_blur_scale = 14            # blur = 14 * scale
glow_opacity_base = 0.72        # opacity = base - per_lum * lum (0-1 scale), floored at min
glow_opacity_per_lum = 0.22
glow_opacity_min = 0.42
fill = "#0e0e12"                # 02 1.4 button fill

[formula.hero_tint]             # 03 1.2 hero card tint from accent
top_alpha = 0.30
mid_alpha = 0.10

[formula.default_button]        # 03 1.5 "Default" button (not scanned or not found): accent-tinted slate, per channel
fill_scale = 0.09
fill_offset = 6
line_scale = 0.55
line_offset = 60
text_base = 120
text_scale = 0.45

