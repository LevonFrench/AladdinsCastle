# AladdinsCastle Hub: design tokens for the Qt 6 / QML front end.
#
# Sources: docs/ui/01-shell-and-filters.md (01), docs/ui/02-game-cards.md (02),
# docs/ui/03-detail-and-install-flow.md (03), and the component map in docs/ui/04-qml-components.md.
# "Hub" = PCVR Mods Installer Hub, commit a64401f (MIT). Hub line references are relative to
# _refs/PCVR-Mods-Installer-Hub/ (local reference clone, gitignored).
#
# Conventions
#   Colours  "#rrggbb" (opaque) or "#aarrggbb" (alpha first: Qt QColor and WPF order).
#            Spec 02 writes its fade as 8-digit RRGGBBAA; it is converted here (see surface.card_fade).
#   Sizes    logical px at 100% scale. S / M / L values are inline tables { S = .., M = .., L = .. }.
#   Time     milliseconds.
#   Weight   numeric, same as QML font.weight: 400 Regular, 500 Medium, 600 SemiBold, 700 Bold, 800 ExtraBold.
#   Tags     [proposal] not in the Hub or in 01-03.  [open] owner decision pending.
#            [conflict Cn] two specs disagree; see docs/ui/04-qml-components.md section 10 and
#            docs/ui/05-models.md section 12. The value shown is the one the component map uses.
#   Every token names its source in a comment.

[meta]
schema_version = 1
status = "draft, 2026-10-08"
specs = ["docs/ui/01-shell-and-filters.md", "docs/ui/02-game-cards.md", "docs/ui/03-detail-and-install-flow.md"]
components = "docs/ui/04-qml-components.md"
models = "docs/ui/05-models.md"

