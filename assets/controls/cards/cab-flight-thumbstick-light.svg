<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="740" viewBox="0 0 1080 740">
    <defs><linearGradient id="metal"><stop stop-color="#6b859c"/><stop offset=".45" stop-color="#d9e7ef"/><stop offset="1" stop-color="#758a9e"/></linearGradient></defs>
    <style>text{font-family:Arial,sans-serif;fill:#142f44}svg{--plate:#c5dbe7;--rubber:#253c4e;--muted:#7192aa;--teal:#31c8bb}</style>
    <rect width="1080" height="740" rx="20" fill="#f5f8fc"/><text x="35" y="52" font-size="31" font-weight="700">Flight stick / thumbstick</text>
    <text x="35" y="92" font-size="22">Use the left thumbstick to aim; the right trigger fires and A presses Event.</text><g transform="translate(25,85)">
    <rect x="96" y="395" width="256" height="102" rx="24" fill="var(--plate)" stroke="url(#metal)" stroke-width="6"/>
    <ellipse cx="224" cy="402" rx="66" ry="22" fill="var(--rubber)"/>
    <path d="M224 405L224 307" stroke="url(#metal)" stroke-width="22"/>
    <path d="M179 311L197 189L251 181L278 212L263 325Z" fill="var(--rubber)" stroke="url(#metal)" stroke-width="4"/>
    <path d="M168 326H277" stroke="var(--plate)" stroke-width="20"/>
    <path d="M196 258L169 281L173 311" stroke="#31c8bb" stroke-width="13" fill="none"/>
    <ellipse cx="252" cy="194" rx="15" ry="10" fill="#31c8bb"/>
    <g fill="#31c8bb"><circle cx="286" cy="273" r="18"/><circle cx="151" cy="287" r="18"/><circle cx="289" cy="185" r="18"/></g>
    <g font-size="22" text-anchor="middle"><text x="286" y="280">1</text><text x="151" y="294">2</text><text x="289" y="192">3</text></g></g><circle cx="485" cy="195" r="15" fill="#31c8bb"/><text x="485" y="202" text-anchor="middle" font-size="20" fill="#102030">1</text><text x="515" y="194" font-size="24" font-weight="700">AIM</text><text x="515" y="222" font-size="23">Left thumbstick: left/right and up/down.</text><circle cx="485" cy="272" r="15" fill="#31c8bb"/><text x="485" y="279" text-anchor="middle" font-size="20" fill="#102030">2</text><text x="515" y="271" font-size="24" font-weight="700">TRIGGER / FIRE</text><text x="515" y="299" font-size="23">Right trigger = AnalogJoyTrigger.</text><circle cx="485" cy="349" r="15" fill="#31c8bb"/><text x="485" y="356" text-anchor="middle" font-size="20" fill="#102030">3</text><text x="515" y="348" font-size="24" font-weight="700">EVENT BUTTON</text><text x="515" y="376" font-size="23">A = AnalogJoyEvent.</text><circle cx="485" cy="426" r="15" fill="#31c8bb"/><text x="485" y="433" text-anchor="middle" font-size="20" fill="#102030">4</text><text x="515" y="425" font-size="24" font-weight="700">START / CREDIT</text><text x="515" y="453" font-size="23">Right stick click starts; B inserts</text><text x="515" y="478" font-size="23">credit.</text>
    <text x="35" y="702" font-size="23">Choose before launch • grip to grab • calibrate reach • pause cancels input</text></svg>