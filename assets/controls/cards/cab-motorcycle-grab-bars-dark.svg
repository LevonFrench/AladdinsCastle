<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="740" viewBox="0 0 1080 740">
    <defs><linearGradient id="metal"><stop stop-color="#6b859c"/><stop offset=".45" stop-color="#d9e7ef"/><stop offset="1" stop-color="#758a9e"/></linearGradient></defs>
    <style>text{font-family:Arial,sans-serif;fill:#edf6fc}svg{--plate:#274659;--rubber:#09151e;--muted:#7192aa;--teal:#31c8bb}</style>
    <rect width="1080" height="740" rx="20" fill="#102030"/><text x="35" y="52" font-size="31" font-weight="700">Motorcycle / grab bars</text>
    <text x="35" y="92" font-size="22">Turn grabbed handlebars; triggers work the gas and front brake.</text><g transform="translate(25,80)" stroke-linecap="round">
    <rect x="150" y="220" width="120" height="130" rx="42" fill="var(--plate)"/>
    <path d="M210 255V170M210 170L125 145L65 165M210 170L295 145L365 165" stroke="url(#metal)" stroke-width="19" fill="none"/>
    <path d="M38 171L100 153M329 155L397 177" stroke="var(--rubber)" stroke-width="30"/>
    <path d="M295 165L330 205L390 218" stroke="url(#metal)" stroke-width="12" fill="none"/>
    <path d="M150 367L176 407H234L270 367" fill="url(#metal)"/><path d="M183 378H244M188 392H237" stroke="var(--rubber)" stroke-width="8"/>
    <g fill="#31c8bb"><circle cx="210" cy="152" r="18"/><circle cx="387" cy="158" r="18"/><circle cx="354" cy="229" r="18"/><circle cx="274" cy="398" r="18"/></g>
    <g font-size="22" text-anchor="middle"><text x="210" y="159">1</text><text x="387" y="165">2</text><text x="354" y="236">3</text><text x="274" y="405">4</text></g></g><circle cx="485" cy="195" r="15" fill="#31c8bb"/><text x="485" y="202" text-anchor="middle" font-size="20" fill="#102030">1</text><text x="515" y="194" font-size="24" font-weight="700">STEERING</text><text x="515" y="222" font-size="23">Grip both bars; turn left / right.</text><circle cx="485" cy="272" r="15" fill="#31c8bb"/><text x="485" y="279" text-anchor="middle" font-size="20" fill="#102030">2</text><text x="515" y="271" font-size="24" font-weight="700">THROTTLE</text><text x="515" y="299" font-size="23">Right trigger.</text><circle cx="485" cy="349" r="15" fill="#31c8bb"/><text x="485" y="356" text-anchor="middle" font-size="20" fill="#102030">3</text><text x="515" y="348" font-size="24" font-weight="700">FRONT BRAKE</text><text x="515" y="376" font-size="23">Left trigger.</text><circle cx="485" cy="426" r="15" fill="#31c8bb"/><text x="485" y="433" text-anchor="middle" font-size="20" fill="#102030">4</text><text x="515" y="425" font-size="24" font-weight="700">REAR BRAKE</text><text x="515" y="453" font-size="23">Hold A.</text><circle cx="485" cy="503" r="15" fill="#31c8bb"/><text x="485" y="510" text-anchor="middle" font-size="20" fill="#102030">5</text><text x="515" y="502" font-size="24" font-weight="700">SHIFT / VIEW / MUSIC</text><text x="515" y="530" font-size="23">Right stick up/down; X view; Y music.</text><circle cx="485" cy="580" r="15" fill="#31c8bb"/><text x="485" y="587" text-anchor="middle" font-size="20" fill="#102030">6</text><text x="515" y="579" font-size="24" font-weight="700">START / CREDIT</text><text x="515" y="607" font-size="23">Right stick click starts; B inserts</text><text x="515" y="632" font-size="23">credit.</text>
    <text x="35" y="702" font-size="23">Choose before launch • grip to grab • calibrate reach • pause cancels input</text></svg>