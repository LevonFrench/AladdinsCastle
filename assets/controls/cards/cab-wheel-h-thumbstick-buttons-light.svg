<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660">
    <defs><linearGradient id="metal"><stop stop-color="#64798e"/><stop offset=".4" stop-color="#d7e2eb"/><stop offset="1" stop-color="#748ca0"/></linearGradient></defs>
    <style>svg{--muted:#53718b;--plate:#cfdee8;--rubber:#243748;--teal:#31c8bb}text{font-family:Arial,sans-serif;fill:#15283d}</style>
    <rect width="1080" height="660" rx="22" fill="#f6f8fb"/><rect x="32" y="30" width="5" height="69" rx="2" fill="#31c8bb"/>
    <text x="54" y="57" font-size="30" font-weight="700">Thumbstick steering / gear buttons</text><text x="54" y="92" font-size="20">Steer with your left thumbstick, with analog triggers for the pedals.</text>
    <g transform="translate(15,0)">
    <rect x="40" y="150" width="388" height="365" rx="40" fill="url(#metal)" opacity=".18"/>
    <g stroke="var(--muted)" stroke-width="3"><rect x="97" y="139" width="278" height="50" rx="14" fill="var(--plate)"/>
    <g fill="var(--teal)"><rect x="110" y="150" width="46" height="26" rx="7"/><rect x="175" y="150" width="46" height="26" rx="7"/><rect x="240" y="150" width="46" height="26" rx="7"/><rect x="305" y="150" width="46" height="26" rx="7"/></g></g>
    <g stroke-linecap="round"><circle cx="217" cy="290" r="93" fill="none" stroke="var(--rubber)" stroke-width="24"/>
    <path d="M217 290L137 244M217 290L297 244M217 290V379" stroke="url(#metal)" stroke-width="19"/>
    <circle cx="217" cy="290" r="30" fill="var(--plate)" stroke="var(--teal)" stroke-width="5"/></g>
    <rect x="326" y="338" width="79" height="88" rx="13" fill="var(--plate)" stroke="var(--muted)" stroke-width="3"/>
    <path d="M346 351V411M383 351V411M346 382H383" stroke="var(--rubber)" stroke-width="10" fill="none"/>
    <path d="M365 382V328" stroke="url(#metal)" stroke-width="12"/><ellipse cx="365" cy="325" rx="20" ry="23" fill="var(--rubber)"/>
    <g stroke="var(--muted)" stroke-width="3"><path d="M126 444H214L225 521H113Z" fill="url(#metal)"/><path d="M253 444H314L324 521H243Z" fill="url(#metal)"/></g>
    <path d="M129 460H211M126 477H216M124 495H219M254 460H313M250 477H317M248 495H320" stroke="var(--rubber)" stroke-width="8"/>
    </g><circle cx="92" cy="285" r="17" fill="#31c8bb"/><text x="92" y="291" text-anchor="middle" fill="#102233" font-size="19" font-weight="700">1</text><circle cx="325" cy="508" r="17" fill="#31c8bb"/><text x="325" y="514" text-anchor="middle" fill="#102233" font-size="19" font-weight="700">2</text><circle cx="420" cy="379" r="17" fill="#31c8bb"/><text x="420" y="385" text-anchor="middle" fill="#102233" font-size="19" font-weight="700">3</text><circle cx="380" cy="155" r="17" fill="#31c8bb"/><text x="380" y="161" text-anchor="middle" fill="#102233" font-size="19" font-weight="700">4</text><circle cx="496" cy="210" r="14" fill="#31c8bb"/><text x="496" y="216" text-anchor="middle" fill="#102233" font-size="18" font-weight="700">1</text><text x="522" y="210" font-size="24" font-weight="700">STEER</text><text x="522" y="236" font-size="22">Move the left thumbstick left/right.</text><circle cx="496" cy="285" r="14" fill="#31c8bb"/><text x="496" y="291" text-anchor="middle" fill="#102233" font-size="18" font-weight="700">2</text><text x="522" y="285" font-size="24" font-weight="700">PEDALS</text><text x="522" y="311" font-size="22">Right trigger = gas; left trigger = brake.</text><circle cx="496" cy="360" r="14" fill="#31c8bb"/><text x="496" y="366" text-anchor="middle" fill="#102233" font-size="18" font-weight="700">3</text><text x="522" y="360" font-size="24" font-weight="700">GEARS</text><text x="522" y="386" font-size="22">Hold right grip + stick: up 1, down 2,</text><text x="522" y="410" font-size="22">right 3, left 4.</text><circle cx="496" cy="435" r="14" fill="#31c8bb"/><text x="496" y="441" text-anchor="middle" fill="#102233" font-size="18" font-weight="700">4</text><text x="522" y="435" font-size="24" font-weight="700">VIEWS</text><text x="522" y="461" font-size="22">Release right grip; right stick selects</text><text x="522" y="485" font-size="22">views 1–4.</text><circle cx="496" cy="510" r="14" fill="#31c8bb"/><text x="496" y="516" text-anchor="middle" fill="#102233" font-size="18" font-weight="700">5</text><text x="522" y="510" font-size="24" font-weight="700">START / CREDIT</text><text x="522" y="536" font-size="22">Left stick click = Start; right stick click</text><text x="522" y="560" font-size="22">= insert credit.</text>
    <text x="50" y="602" font-size="18">Seated • grab deliberately • release to recenter • pedals need no grab</text>
    <text x="50" y="630" font-size="17" fill="#53718b">Choose before launch. Calibrate the wheel to your comfortable reach; no body lean is required.</text></svg>