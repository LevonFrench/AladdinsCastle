<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="740" viewBox="0 0 1080 740">
    <defs><linearGradient id="metal"><stop stop-color="#6b859c"/><stop offset=".45" stop-color="#d9e7ef"/><stop offset="1" stop-color="#758a9e"/></linearGradient></defs>
    <style>text{font-family:Arial,sans-serif;fill:#edf6fc}svg{--plate:#274659;--rubber:#09151e;--muted:#7192aa;--teal:#31c8bb}</style>
    <rect width="1080" height="740" rx="20" fill="#102030"/><text x="35" y="52" font-size="31" font-weight="700">Mounted / two guns</text>
    <text x="35" y="92" font-size="22">Right hand controls player 1; left hand controls player 2 independently.</text><g transform="translate(18,85)"><path d="M62 229L240 201L330 224L332 292L240 318L66 286Z" fill="var(--plate)" stroke="url(#metal)" stroke-width="6"/>
    <path d="M91 285L109 365L293 365L312 296" stroke="url(#metal)" stroke-width="23" fill="none"/>
    <path d="M193 365V444" stroke="url(#metal)" stroke-width="29"/><rect x="125" y="432" width="147" height="27" rx="8" fill="var(--rubber)"/>
    <path d="M329 241L368 241L366 344" stroke="var(--rubber)" stroke-width="26" fill="none"/>
    <path d="M99 245H206M103 267H210" stroke="var(--rubber)" stroke-width="10" stroke-dasharray="8 9"/><circle cx="65" cy="220" r="17" fill="#31c8bb"/><circle cx="245" cy="314" r="17" fill="#31c8bb"/><circle cx="309" cy="303" r="17" fill="#31c8bb"/>
    <g font-size="22" text-anchor="middle"><text x="65" y="227">1</text><text x="245" y="321">2</text><text x="309" y="310">3</text></g></g><circle cx="485" cy="195" r="15" fill="#31c8bb"/><text x="485" y="202" text-anchor="middle" font-size="20" fill="#102030">1</text><text x="515" y="194" font-size="24" font-weight="700">AIM</text><text x="515" y="222" font-size="23">Grip the handles and aim within the mount.</text><circle cx="485" cy="272" r="15" fill="#31c8bb"/><text x="485" y="279" text-anchor="middle" font-size="20" fill="#102030">2</text><text x="515" y="271" font-size="24" font-weight="700">MAIN TRIGGER</text><text x="515" y="299" font-size="23">Firing-hand trigger for each active</text><text x="515" y="324" font-size="23">player.</text><circle cx="485" cy="349" r="15" fill="#31c8bb"/><text x="485" y="356" text-anchor="middle" font-size="20" fill="#102030">3</text><text x="515" y="348" font-size="24" font-weight="700">SECOND TRIGGER</text><text x="515" y="376" font-size="23">Other-hand trigger with two hands; A/X</text><text x="515" y="401" font-size="23">otherwise.</text><circle cx="485" cy="426" r="15" fill="#31c8bb"/><text x="485" y="433" text-anchor="middle" font-size="20" fill="#102030">4</text><text x="515" y="425" font-size="24" font-weight="700">START / CREDIT</text><text x="515" y="453" font-size="23">Left stick click starts; right stick click</text><text x="515" y="478" font-size="23">inserts credit. Player 2 starts with left</text><text x="515" y="503" font-size="23">Y; credits are shared.</text><circle cx="485" cy="503" r="15" fill="#31c8bb"/><text x="485" y="510" text-anchor="middle" font-size="20" fill="#102030">5</text><text x="515" y="502" font-size="24" font-weight="700">PLAYERS</text><text x="515" y="530" font-size="23">Two independent gun slots.</text>
    <text x="35" y="702" font-size="23">Choose before launch • grip to grab • calibrate reach • pause cancels input</text></svg>