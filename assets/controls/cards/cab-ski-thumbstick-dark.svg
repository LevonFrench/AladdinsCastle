<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="740" viewBox="0 0 1080 740">
    <defs><linearGradient id="metal"><stop stop-color="#6b859c"/><stop offset=".45" stop-color="#d9e7ef"/><stop offset="1" stop-color="#758a9e"/></linearGradient></defs>
    <style>text{font-family:Arial,sans-serif;fill:#edf6fc}svg{--plate:#274659;--rubber:#09151e;--muted:#7192aa;--teal:#31c8bb}</style>
    <rect width="1080" height="740" rx="20" fill="#102030"/><text x="35" y="52" font-size="31" font-weight="700">Ski platform / thumbstick</text>
    <text x="35" y="92" font-size="22">Steer and edge with your left thumbstick; triggers jab the poles.</text><g transform="translate(25,90)"><path d="M95 400L325 400L353 484H65Z" fill="var(--plate)" stroke="url(#metal)" stroke-width="5"/>
    <path d="M116 378H190L180 468H98ZM235 378H308L328 468H249Z" fill="var(--rubber)"/>
    <path d="M130 408H181M256 408H311" stroke="url(#metal)" stroke-width="15"/>
    <path d="M66 438V160L105 135M354 438V160L318 135" stroke="url(#metal)" stroke-width="15" fill="none"/>
    <path d="M80 147L122 121M334 147L293 121" stroke="var(--rubber)" stroke-width="25"/>
    <rect x="149" y="180" width="127" height="32" rx="10" fill="var(--plate)"/><g fill="#31c8bb"><circle cx="172" cy="194" r="10"/><circle cx="212" cy="194" r="10"/><circle cx="252" cy="194" r="10"/></g>
    <g fill="#31c8bb"><circle cx="205" cy="474" r="18"/><circle cx="338" cy="477" r="18"/><circle cx="110" cy="99" r="18"/><circle cx="294" cy="99" r="18"/></g>
    <g font-size="22" text-anchor="middle"><text x="205" y="481">1</text><text x="338" y="484">2</text><text x="110" y="106">3</text><text x="294" y="106">3</text></g></g><circle cx="485" cy="195" r="15" fill="#31c8bb"/><text x="485" y="202" text-anchor="middle" font-size="20" fill="#102030">1</text><text x="515" y="194" font-size="24" font-weight="700">SWING</text><text x="515" y="222" font-size="23">Left stick left/right.</text><circle cx="485" cy="272" r="15" fill="#31c8bb"/><text x="485" y="279" text-anchor="middle" font-size="20" fill="#102030">2</text><text x="515" y="271" font-size="24" font-weight="700">EDGE</text><text x="515" y="299" font-size="23">Left stick forward/back.</text><circle cx="485" cy="349" r="15" fill="#31c8bb"/><text x="485" y="356" text-anchor="middle" font-size="20" fill="#102030">3</text><text x="515" y="348" font-size="24" font-weight="700">POLES</text><text x="515" y="376" font-size="23">Left/right triggers jab matching poles.</text><circle cx="485" cy="426" r="15" fill="#31c8bb"/><text x="485" y="433" text-anchor="middle" font-size="20" fill="#102030">4</text><text x="515" y="425" font-size="24" font-weight="700">SELECT 1 / 2 / 3</text><text x="515" y="453" font-size="23">A / B / X, respectively.</text><circle cx="485" cy="503" r="15" fill="#31c8bb"/><text x="485" y="510" text-anchor="middle" font-size="20" fill="#102030">5</text><text x="515" y="502" font-size="24" font-weight="700">START / CREDIT</text><text x="515" y="530" font-size="23">Left stick click starts; right stick click</text><text x="515" y="555" font-size="23">inserts credit.</text>
    <text x="35" y="702" font-size="23">Choose before launch • grip to grab • calibrate reach • pause cancels input</text></svg>