<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="740" viewBox="0 0 1080 740">
    <defs><linearGradient id="metal"><stop stop-color="#6b859c"/><stop offset=".45" stop-color="#d9e7ef"/><stop offset="1" stop-color="#758a9e"/></linearGradient></defs>
    <style>text{font-family:Arial,sans-serif;fill:#edf6fc}svg{--plate:#274659;--rubber:#09151e;--muted:#7192aa;--teal:#31c8bb}</style>
    <rect width="1080" height="740" rx="20" fill="#102030"/><text x="35" y="52" font-size="31" font-weight="700">Virtua Fighter 3 / grab stick</text>
    <text x="35" y="92" font-size="22">Grip and tilt the arcade stick with your left hand; use separate action buttons.</text><g transform="translate(12,100)"><rect x="44" y="292" width="381" height="162" rx="25" fill="var(--plate)" stroke="url(#metal)" stroke-width="6"/>
    <ellipse cx="113" cy="351" rx="43" ry="13" fill="var(--rubber)"/><path d="M113 349V267" stroke="url(#metal)" stroke-width="15"/>
    <circle cx="113" cy="258" r="29" fill="#31c8bb"/><text x="113" y="266" font-size="23" text-anchor="middle">1</text><circle cx="188" cy="322" r="22" fill="var(--rubber)"/><circle cx="188" cy="317" r="17" fill="#31c8bb"/><text x="188" y="324" font-size="20" text-anchor="middle">2</text><circle cx="240" cy="322" r="22" fill="var(--rubber)"/><circle cx="240" cy="317" r="17" fill="#31c8bb"/><text x="240" y="324" font-size="20" text-anchor="middle">3</text><circle cx="292" cy="322" r="22" fill="var(--rubber)"/><circle cx="292" cy="317" r="17" fill="#31c8bb"/><text x="292" y="324" font-size="20" text-anchor="middle">4</text><circle cx="344" cy="322" r="22" fill="var(--rubber)"/><circle cx="344" cy="317" r="17" fill="#31c8bb"/><text x="344" y="324" font-size="20" text-anchor="middle">5</text><path d="M191 374H394" stroke="url(#metal)" stroke-width="4"/>
    <text x="195" y="409" font-size="19">Start: left stick click</text></g><circle cx="485" cy="195" r="15" fill="#31c8bb"/><text x="485" y="202" text-anchor="middle" font-size="20" fill="#102030">1</text><text x="515" y="194" font-size="24" font-weight="700">MOVE</text><text x="515" y="222" font-size="23">Grip the left stick; tilt in eight</text><text x="515" y="247" font-size="23">directions.</text><circle cx="485" cy="272" r="15" fill="#31c8bb"/><text x="485" y="279" text-anchor="middle" font-size="20" fill="#102030">2</text><text x="515" y="271" font-size="24" font-weight="700">PUNCH</text><text x="515" y="299" font-size="23">Right trigger.</text><circle cx="485" cy="349" r="15" fill="#31c8bb"/><text x="485" y="356" text-anchor="middle" font-size="20" fill="#102030">3</text><text x="515" y="348" font-size="24" font-weight="700">KICK</text><text x="515" y="376" font-size="23">A.</text><circle cx="485" cy="426" r="15" fill="#31c8bb"/><text x="485" y="433" text-anchor="middle" font-size="20" fill="#102030">4</text><text x="515" y="425" font-size="24" font-weight="700">GUARD</text><text x="515" y="453" font-size="23">Left trigger.</text><circle cx="485" cy="503" r="15" fill="#31c8bb"/><text x="485" y="510" text-anchor="middle" font-size="20" fill="#102030">5</text><text x="515" y="502" font-size="24" font-weight="700">ESCAPE</text><text x="515" y="530" font-size="23">B.</text><circle cx="485" cy="580" r="15" fill="#31c8bb"/><text x="485" y="587" text-anchor="middle" font-size="20" fill="#102030">6</text><text x="515" y="579" font-size="24" font-weight="700">START / CREDIT</text><text x="515" y="607" font-size="23">Left stick click = Start; right stick</text><text x="515" y="632" font-size="23">click = credit. Start during a fight</text><text x="515" y="657" font-size="23">switches to first-person view; it never</text><text x="515" y="682" font-size="23">shares an attack button.</text>
    <text x="35" y="702" font-size="23">Choose before launch • grip to grab • calibrate reach • pause cancels input</text></svg>