<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="740" viewBox="0 0 1080 740">
    <defs><linearGradient id="metal"><stop stop-color="#6b859c"/><stop offset=".45" stop-color="#d9e7ef"/><stop offset="1" stop-color="#758a9e"/></linearGradient></defs>
    <style>text{font-family:Arial,sans-serif;fill:#142f44}svg{--plate:#c5dbe7;--rubber:#253c4e;--muted:#7192aa;--teal:#31c8bb}</style>
    <rect width="1080" height="740" rx="20" fill="#f5f8fc"/><text x="35" y="52" font-size="31" font-weight="700">Handcar / grab pump</text>
    <text x="35" y="92" font-size="22">Grab and pump the two handles; each controller belongs to one player.</text><g transform="translate(12,90)"><path d="M63 437H357L402 518H22Z" fill="var(--plate)" stroke="url(#metal)" stroke-width="6"/>
    <path d="M110 431V349M310 431V349" stroke="url(#metal)" stroke-width="19"/>
    <path d="M110 351L134 243M310 351L286 243" stroke="url(#metal)" stroke-width="20"/>
    <path d="M94 242H170M250 242H326" stroke="var(--rubber)" stroke-width="25"/>
    <rect x="74" y="453" width="84" height="46" rx="8" fill="url(#metal)"/><rect x="260" y="453" width="84" height="46" rx="8" fill="url(#metal)"/>
    <path d="M80 465H152M80 483H152M266 465H338M266 483H338" stroke="var(--rubber)" stroke-width="8"/>
    <g fill="#31c8bb"><circle cx="315" cy="213" r="18"/><circle cx="103" cy="213" r="18"/><circle cx="193" cy="480" r="18"/></g>
    <g font-size="22" text-anchor="middle"><text x="315" y="220">1</text><text x="103" y="220">2</text><text x="193" y="487">3</text></g></g><circle cx="485" cy="195" r="15" fill="#31c8bb"/><text x="485" y="202" text-anchor="middle" font-size="20" fill="#102030">1</text><text x="515" y="194" font-size="24" font-weight="700">PLAYER 1 PUMP</text><text x="515" y="222" font-size="23">Grip right handle; move up/down.</text><circle cx="485" cy="272" r="15" fill="#31c8bb"/><text x="485" y="279" text-anchor="middle" font-size="20" fill="#102030">2</text><text x="515" y="271" font-size="24" font-weight="700">PLAYER 2 PUMP</text><text x="515" y="299" font-size="23">Grip left handle; move up/down.</text><circle cx="485" cy="349" r="15" fill="#31c8bb"/><text x="485" y="356" text-anchor="middle" font-size="20" fill="#102030">3</text><text x="515" y="348" font-size="24" font-weight="700">PEDALS</text><text x="515" y="376" font-size="23">Right/left trigger = P1/P2 pedal.</text><circle cx="485" cy="426" r="15" fill="#31c8bb"/><text x="485" y="433" text-anchor="middle" font-size="20" fill="#102030">4</text><text x="515" y="425" font-size="24" font-weight="700">START / CREDIT</text><text x="515" y="453" font-size="23">A/B = P1 start/credit; X/Y = P2.</text><circle cx="485" cy="503" r="15" fill="#31c8bb"/><text x="485" y="510" text-anchor="middle" font-size="20" fill="#102030">5</text><text x="515" y="502" font-size="24" font-weight="700">HANDOFF</text><text x="515" y="530" font-size="23">Two independent players; no invented</text><text x="515" y="555" font-size="23">wheel.</text>
    <text x="35" y="702" font-size="23">Choose before launch • grip to grab • calibrate reach • pause cancels input</text></svg>