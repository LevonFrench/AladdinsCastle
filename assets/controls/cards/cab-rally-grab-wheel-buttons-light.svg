    <path d="M129 460H211M126 477H216M124 495H219M254 460H313M250 477H317M248 495H320" stroke="var(--rubber)" stroke-width="8"/>
    </g><circle cx="92" cy="285" r="17" fill="#31c8bb"/><text x="92" y="292" text-anchor="middle" font-size="22">1</text><circle cx="325" cy="508" r="17" fill="#31c8bb"/><text x="325" y="515" text-anchor="middle" font-size="22">2</text><circle cx="420" cy="379" r="17" fill="#31c8bb"/><text x="420" y="386" text-anchor="middle" font-size="22">3</text><circle cx="380" cy="155" r="17" fill="#31c8bb"/><text x="380" y="162" text-anchor="middle" font-size="22">4</text><path d="M390 545L430 457" stroke="url(#metal)" stroke-width="14"/><path d="M425 467L443 430" stroke="var(--rubber)" stroke-width="22"/><circle cx="446" cy="540" r="16" fill="#31c8bb"/><text x="446" y="548" text-anchor="middle" font-size="22">6</text><circle cx="485" cy="195" r="15" fill="#31c8bb"/><text x="485" y="202" text-anchor="middle" font-size="20" fill="#102030">1</text><text x="515" y="194" font-size="24" font-weight="700">STEERING</text><text x="515" y="222" font-size="23">Grip rim and turn both hands.</text><circle cx="485" cy="272" r="15" fill="#31c8bb"/><text x="485" y="279" text-anchor="middle" font-size="20" fill="#102030">2</text><text x="515" y="271" font-size="24" font-weight="700">GAS / BRAKE</text><text x="515" y="299" font-size="23">Right trigger gas; left trigger brake.</text><circle cx="485" cy="349" r="15" fill="#31c8bb"/><text x="485" y="356" text-anchor="middle" font-size="20" fill="#102030">3</text><text x="515" y="348" font-size="24" font-weight="700">GEARS</text><text x="515" y="376" font-size="23">Right grip + right stick selects gear.</text><circle cx="485" cy="426" r="15" fill="#31c8bb"/><text x="485" y="433" text-anchor="middle" font-size="20" fill="#102030">4</text><text x="515" y="425" font-size="24" font-weight="700">VIEW</text><text x="515" y="453" font-size="23">Click the right thumbstick.</text><circle cx="485" cy="503" r="15" fill="#31c8bb"/><text x="485" y="510" text-anchor="middle" font-size="20" fill="#102030">5</text><text x="515" y="502" font-size="24" font-weight="700">START / CREDIT</text><text x="515" y="530" font-size="23">A starts; B inserts credit.</text><circle cx="485" cy="580" r="15" fill="#31c8bb"/><text x="485" y="587" text-anchor="middle" font-size="20" fill="#102030">6</text><text x="515" y="579" font-size="24" font-weight="700">HANDBRAKE</text><text x="515" y="607" font-size="23">Hold X for the handbrake.</text>
    <text x="35" y="702" font-size="23">Choose before launch • grip to grab • calibrate reach • pause cancels input</text></svg>